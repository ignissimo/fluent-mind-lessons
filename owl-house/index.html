<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Your Story — The Owl House</title><style>body{margin:0;background:#12172a;color:#f7f3ff;font:17px system-ui}main{max-width:850px;margin:auto;padding:25px}h1{font-size:clamp(30px,5vw,48px)}p{line-height:1.6;color:#c6c9dc}.card{background:#222c48;border:1px solid #47516d;padding:24px;border-radius:20px;margin:20px 0}.top{color:#e8bb79;font-weight:bold;letter-spacing:2px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{background:#303d5b;border:2px solid #303d5b;border-radius:15px;padding:20px;color:white;cursor:pointer;font:inherit;text-align:left}.choice.active{border-color:#a5e7d1}.choice b{display:block;font-size:22px}.choice span{display:block;font-size:40px}.choice small{color:#c6c9dc}.btn{border:0;border-radius:12px;background:#e8bb79;color:#1b1d2d;font-weight:bold;padding:13px 20px;cursor:pointer}.btn.alt{background:#3d4d6c;color:white}.nav{display:flex;justify-content:space-between;margin-top:20px}textarea{width:100%;box-sizing:border-box;min-height:90px;background:#121a2e;border:1px solid #697594;color:white;border-radius:10px;padding:12px;font:inherit}label{display:block;font-weight:700;margin:20px 0 8px}.clues{display:flex;gap:10px;flex-wrap:wrap}.clues span{padding:12px 15px;border-radius:30px;background:#394965}.bank{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.word{padding:9px 12px;background:#435574;border:1px solid #647593;border-radius:8px;color:white;cursor:pointer}.word:disabled{opacity:.25}.answer{min-height:40px;border-bottom:1px dashed #8594b2;padding:10px 0}.puzzle{background:#19233c;border-radius:14px;padding:15px;margin:14px 0}.feedback{color:#a5e7d1;font-size:14px}.progress{height:7px;background:#3b4764;border-radius:10px;margin:20px 0}.progress div{height:100%;background:#a5e7d1;border-radius:10px}canvas{width:100%;height:280px;background:#fffaf1;border-radius:12px;touch-action:none}input[type=color]{vertical-align:middle}a{color:#a5e7d1}@media(max-width:650px){.choices{grid-template-columns:1fr}main{padding:16px}.card{padding:17px}}</style><main><div class="top">✦ THE OWL HOUSE · S2E8</div><div class="progress"><div id="progress"></div></div><div id="root"></div></main><script>
const stories={king:{icon:'👑',name:'King',theme:'Finding your voice',events:['King wants to learn what kind of demon he is.','Hooty helps King investigate his identity.','King discovers a surprising new power.'],a:'How does King feel when he discovers his new power? Why?',b:'Why is learning about his identity so important to King? Write 3–4 sentences using because and but.',draw:'Draw a symbol for King’s new power.'},eda:{icon:'🦉',name:'Eda',theme:'Making peace with fear',events:['Eda remembers difficult moments from her past.','She meets the Owl Beast in her dream.','She begins to accept the Owl Beast as part of herself.'],a:'How does Eda feel about her curse at the beginning?',b:'What changes in Eda’s relationship with the Owl Beast? Write 3–4 sentences using at first and however.',draw:'Draw a symbol for Eda accepting the Owl Beast.'},luz:{icon:'💜',name:'Luz & Amity',theme:'The courage to be honest',events:['Luz is nervous about her feelings.','Hooty tries to help, but his plan causes chaos.','Luz and Amity finally ask each other out.'],a:'Why is Luz nervous about telling Amity how she feels?',b:'Why is it sometimes difficult to talk about feelings? Write 3–4 sentences using because and even though.',draw:'Draw a symbol of courage for Luz and Amity.'}};
const clues=['Hooty','tunnel','Owl Beast','dream','scream','Amity','letter'];const sentences=['Sometimes facing your fears is better than running away.','Good intentions do not always lead to good results.','It takes courage to tell someone how you feel.','People can change when they learn to accept themselves.'];let page=0,branch='',answers={},selected={},drawing='';const root=document.getElementById('root');function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function field(k,placeholder){return `<textarea placeholder="${placeholder}" oninput="answers['${k}']=this.value">${esc(answers[k])}</textarea>`}function nav(){return `<div class="nav"><button class="btn alt" onclick="move(-1)">← Back</button><button class="btn" onclick="move(1)">${page===5?'Finish ✨':'Next →'}</button></div>`}function choose(x){branch=x;render()}function move(d){if(d===1&&page===1&&!branch){alert('Choose a storyline first!');return}page+=d;if(page<0)page=0;if(page>5){end();return}render();window.scrollTo(0,0)}function render(){document.getElementById('progress').style.width=((page+1)/6*100)+'%';let h='';if(page===0)h=`<h1>🔮 Memory Portal</h1><p>Use these seven clues to tell your teacher what happened in the episode. Speak — no writing yet!</p><div class="card"><div class="clues">${clues.map(x=>`<span>${x}</span>`).join('')}</div><p>🎤 What happened first? Which event surprised you most?</p></div>`;if(page===1)h=`<h1>Choose Your Story</h1><p>Which storyline was the most interesting or important to you? Your writing missions will change with your choice.</p><div class="choices">${Object.entries(stories).map(([id,s])=>`<button class="choice ${branch===id?'active':''}" onclick="choose('${id}')"><span>${s.icon}</span><b>${s.name}</b><small>${s.theme}</small></button>`).join('')}</div>`;if(page===2){let s=stories[branch];h=`<h1>${s.icon} ${s.name}'s Journey</h1><p>Tell the story out loud. Then write just one sentence.</p><div class="card">${s.events.map(e=>`<p>✦ ${e}</p>`).join('')}<label>✍️ What changed most for ${s.name}?</label>${field('change_'+branch,'At first..., but by the end...')}</div>`}if(page===3){let s=stories[branch];h=`<h1>✍️ Writing Mission</h1><p>Discuss first. Then write short, thoughtful answers.</p><div class="card"><label>Task 1 · 1–2 sentences</label><h3>${s.a}</h3>${field('a_'+branch,'I think... because...')}<label>Task 2 · 3–4 sentences</label><h3>${s.b}</h3><p>Try: At first... / However... / For example... / In the end...</p>${field('b_'+branch,'Write your mini-paragraph...')}</div>`}if(page===4)h=`<h1>🧩 Word Workshop</h1><p>All storylines come together! Tap the words in the correct order to rebuild each sentence.</p><div class="card"><div class="clues"><span>face your fears</span><span>run away</span><span>good intentions</span><span>lead to</span><span>courage</span><span>accept yourself</span></div><p>🎤 Which two expressions best describe the episode?</p></div><div id="puzzles"></div>`;if(page===5)h=`<h1>🎨 Creative Finale</h1><p>${stories[branch].draw} Explain your symbol out loud.</p><div class="card"><canvas id="draw"></canvas><p><label style="display:inline">Pen color <input type="color" id="color" value="#603bb2"></label> <button class="btn alt" onclick="clearCanvas()">Clear</button></p><label>Optional: Give your symbol a name.</label>${field('symbol_'+branch,'My symbol is called...')}</div>`;root.innerHTML=h+nav();if(page===4)renderPuzzles();if(page===5)initCanvas()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}let banks=sentences.map(s=>shuffle(s.split(' ')));function renderPuzzles(){document.getElementById('puzzles').innerHTML=sentences.map((s,i)=>`<div class="puzzle"><b>Sentence ${i+1}</b><div class="answer" id="ans${i}"></div><div class="bank" id="bank${i}"></div><button class="btn alt" onclick="reset(${i})">Reset</button> <button class="btn" onclick="check(${i})">Check</button><div class="feedback" id="feed${i}"></div></div>`).join('');sentences.forEach((_,i)=>drawPuzzle(i))}function drawPuzzle(i){let arr=selected[i]||[];document.getElementById('ans'+i).innerHTML=arr.map((x,k)=>`<button class="word" onclick="removeWord(${i},${k})">${esc(banks[i][x])}</button>`).join(' ');document.getElementById('bank'+i).innerHTML=banks[i].map((w,k)=>`<button class="word" ${arr.includes(k)?'disabled':''} onclick="addWord(${i},${k})">${esc(w)}</button>`).join('')}function addWord(i,k){(selected[i]??=[]).push(k);drawPuzzle(i)}function removeWord(i,k){selected[i].splice(k,1);drawPuzzle(i)}function reset(i){selected[i]=[];drawPuzzle(i);document.getElementById('feed'+i).textContent=''}function check(i){let got=(selected[i]||[]).map(k=>banks[i][k]).join(' ');document.getElementById('feed'+i).textContent=got===sentences[i]?'✓ Perfect!':'Not quite. Try again!'}let canvas,ctx,painting=false;function initCanvas(){canvas=document.getElementById('draw');let ratio=window.devicePixelRatio||1;let w=canvas.clientWidth,h=280;canvas.width=w*ratio;canvas.height=h*ratio;ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='#fffaf1';ctx.fillRect(0,0,w,h);if(drawing){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0,w,h);img.src=drawing}const point=e=>{let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);let [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y)};canvas.onpointermove=e=>{if(!painting)return;let [x,y]=point(e);ctx.strokeStyle=document.getElementById('color').value;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineTo(x,y);ctx.stroke()};canvas.onpointerup=()=>{painting=false;drawing=canvas.toDataURL()}}function clearCanvas(){drawing='';initCanvas()}function end(){let lines=['THE OWL HOUSE — MY STORY','Chosen storyline: '+stories[branch].name,'','What changed: '+(answers['change_'+branch]||''),'Task 1: '+(answers['a_'+branch]||''),'Task 2: '+(answers['b_'+branch]||''),'Symbol: '+(answers['symbol_'+branch]||'')];let text=lines.join('\n');root.innerHTML=`<div class="card" style="text-align:center"><h1>✨ Mission Complete!</h1><p>You explored ${stories[branch].name}'s story, practiced writing, and solved the vocabulary puzzles.</p><button class="btn" onclick="download()">Save my answers ↓</button> <button class="btn alt" onclick="page=0;render()">Play again</button><p>Next stop: the next episode!</p></div>`;window.exportText=text}function download(){let blob=new Blob([window.exportText],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='owl-house-my-story.txt';a.click();URL.revokeObjectURL(url)}render();
</script></html>
