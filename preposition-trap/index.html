<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preposition Trap — English Challenge</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#182743;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:850px;margin:auto}.top{background:#182743;color:white;border-radius:22px;padding:26px}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#c9d9ff}.top h1{font-size:clamp(28px,5vw,43px);margin:8px 0}.top p{line-height:1.5;margin-bottom:0}.panel{background:white;margin-top:18px;border-radius:22px;padding:26px;box-shadow:0 5px 24px #18274313}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:bold}.track{height:12px;background:#e5eaf2;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#3b70d7;width:0;transition:width .25s}.tag{display:inline-block;border-radius:20px;background:#eaf0ff;padding:7px 13px;color:#254a92;font-size:14px;font-weight:bold}.question{font-size:clamp(23px,3.8vw,33px);line-height:1.5;margin:24px 0}.blank{color:#315cbd;border-bottom:3px solid #315cbd;padding:0 10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:2px solid #ccd6e6;border-radius:16px;padding:17px 12px;font-size:21px;font-weight:bold;background:white;color:#182743;cursor:pointer;min-height:65px}.choice:hover:not(:disabled),.choice:focus-visible{border-color:#315cbd;background:#edf3ff}.choice.correct{background:#e4f6eb;border-color:#27824a}.choice.wrong{background:#ffe9e7;border-color:#bd4242}.choice:disabled{cursor:default}.feedback{min-height:72px;margin-top:18px;line-height:1.5;font-size:18px}.feedback strong{display:block}.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:14px}.btn{background:#315cbd;color:white;border:0;border-radius:13px;padding:14px 22px;font-size:17px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.secondary{background:#eaf0ff;color:#254a92}.note{font-size:14px;color:#53637c}.end{text-align:center}.end h2{font-size:32px}.review{text-align:left;margin-top:20px}.review li{padding:10px 0;line-height:1.5}.review .miss{color:#a22b2b}.review .hit{color:#267044}.hidden{display:none}button:focus-visible{outline:3px solid #f5aa32;outline-offset:3px}@media(max-width:540px){body{padding:12px}.panel,.top{padding:20px}.choices{grid-template-columns:1fr}.question{font-size:24px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">English Challenge · Level 2</div><h1>🪤 Preposition Trap</h1><p>Choose the missing preposition. Some answers look right — but only one fits the sentence. 15 questions, three rounds, no typing.</p></header><section class="panel" id="game"><div class="status"><span id="counter">Question 1 / 15</span><span id="score">Score: 0</span></div><div class="track" aria-label="Progress"><div class="fill" id="fill"></div></div><span class="tag" id="round">Round 1 · Place & Time</span><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><span class="note">Read aloud if needed. Take your time.</span><button class="btn" id="next" disabled>Next →</button></div></section><section class="panel end hidden" id="end"><h2 id="headline">Well played!</h2><p id="summary"></p><button class="btn" id="retry">Play again ↻</button><button class="btn secondary" id="toggleReview">Show answer review</button><ol class="review hidden" id="review"></ol></section></main>
<script>
const questions=[
{q:'We arrived ___ the airport at eight o’clock.',opts:['in','on','at','to'],a:2,why:'Arrive at a specific place: at the airport.'},
{q:'My birthday is ___ November.',opts:['on','in','at','by'],a:1,why:'Use in with months: in November.'},
{q:'The keys are ___ the table, next to the book.',opts:['on','at','into','between'],a:0,why:'On means touching the surface of something.'},
{q:'The lesson starts ___ 4:30.',opts:['on','in','at','for'],a:2,why:'Use at with clock times.'},
{q:'There is a small garden ___ our house.',opts:['behind','during','since','until'],a:0,why:'Behind means at the back of something.'},
{q:'She is very good ___ solving puzzles.',opts:['in','at','on','for'],a:1,why:'The fixed expression is good at.'},
{q:'I am interested ___ science and space.',opts:['at','for','in','on'],a:2,why:'The fixed expression is interested in.'},
{q:'We listened ___ a story about a mysterious island.',opts:['to','at','on','for'],a:0,why:'We listen to something.'},
{q:'He is afraid ___ spiders, but he loves snakes.',opts:['from','about','of','with'],a:2,why:'The fixed expression is afraid of.'},
{q:'This book belongs ___ my sister.',opts:['for','to','with','at'],a:1,why:'Belong to tells us who owns something.'},
{q:'I have lived here ___ 2022.',opts:['for','during','since','until'],a:2,why:'Since + starting point (2022).'},
{q:'She has studied English ___ three years.',opts:['since','for','at','from'],a:1,why:'For + duration (three years).'},
{q:'The children ran ___ the bridge to reach the other side.',opts:['under','across','between','behind'],a:1,why:'Across means from one side to the other.'},
{q:'We stayed indoors ___ the storm.',opts:['during','since','until','between'],a:0,why:'During means while an event was happening.'},
{q:'He walked ___ the room and closed the door behind him.',opts:['on','at','into','between'],a:2,why:'Into expresses movement from outside to inside.'}
];
let index=0,score=0,selected=[],answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;let x=questions[index];$('counter').textContent=`Question ${index+1} / ${questions.length}`;$('score').textContent=`Score: ${score}`;$('fill').style.width=`${index/questions.length*100}%`;$('round').textContent=index<5?'Round 1 · Place & Time':index<10?'Round 2 · Tricky Phrases':'Round 3 · Expert Traps';$('question').innerHTML=x.q.replace('___','<span class="blank">_____</span>');$('choices').innerHTML='';x.opts.forEach((opt,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);$('choices').appendChild(b)});$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'See results →':'Next →'}
function choose(i){if(answered)return;answered=true;let x=questions[index];selected[index]=i;if(i===x.a)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML=`<strong>${i===x.a?'✓ Correct!':'Not quite — the correct answer is '+x.opts[x.a]+'.'}</strong>${x.why}`;$('score').textContent=`Score: ${score}`;$('next').disabled=false}
$('next').onclick=()=>{index++;if(index<questions.length)render();else finish()};function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('headline').textContent=score>=13?'🏆 Trap Master!':score>=9?'⭐ Great detective work!':'🔍 Keep investigating!';$('summary').textContent=`You got ${score} out of ${questions.length} correct. Every trap you noticed makes the next one easier.`;$('review').innerHTML=questions.map((x,i)=>`<li class="${selected[i]===x.a?'hit':'miss'}"><strong>${x.q.replace('___',x.opts[x.a])}</strong><br>Your answer: ${x.opts[selected[i]]}. ${x.why}</li>`).join('')};$('retry').onclick=()=>{index=0;score=0;selected=[];$('end').classList.add('hidden');$('review').classList.add('hidden');$('toggleReview').textContent='Show answer review';$('game').classList.remove('hidden');render()};$('toggleReview').onclick=()=>{let hidden=$('review').classList.toggle('hidden');$('toggleReview').textContent=hidden?'Show answer review':'Hide answer review'};render();
</script></body></html>
