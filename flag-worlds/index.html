const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const modal=$('modal');let state={scene:'museum',x:480,y:470,shirt:'#4099cd',avatar:0,seen:{israel:[],russia:[],japan:[]},done:{},inv:{israel:[],russia:[],japan:[]},order:[],notes:[],name:'',design:null,symbol:'',quiz:{},packed:[],flags:{}};try{let s=JSON.parse(localStorage.getItem('flag_glitch_v3')||'null');if(s)Object.assign(state,s,{scene:'museum',x:480,y:470})}catch(e){}for(const w of ['israel','russia','japan']){for(const k of ['seen','inv']){if(!state[k]||typeof state[k]!=='object')state[k]={};state[k][w]=[...new Set((Array.isArray(state[k][w])?state[k][w]:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<3))]}}if(!state.done||typeof state.done!=='object')state.done={};state.done=Object.fromEntries(['israel','russia','japan'].map(w=>[w,state.done[w]===true]));state.notes=Array.isArray(state.notes)?state.notes.filter(n=>n&&typeof n.title==='string'&&typeof n.text==='string'):[];state.packed=Array.isArray(state.packed)?state.packed:[];state.name=typeof state.name==='string'?state.name:'';state.symbol=typeof state.symbol==='string'?state.symbol:'';state.design=typeof state.design==='string'&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(state.design)?state.design:null;let keys={},objects=[],frame=0,last=0,closeDialog=null;
const flags={israel:`<svg class="flag" viewBox="0 0 220 160"><rect width="220" height="160" fill="white"/><path d="M0 15h220v25H0zM0 120h220v25H0z" fill="#205bb3"/><path d="M110 48 82 96h56z M110 112 82 64h56z" fill="none" stroke="#205bb3" stroke-width="4"/></svg>`,russia:`<svg class="flag" viewBox="0 0 300 200"><g transform="scale(1 1.111111)"><path fill="#fff" d="M0 0h300v60H0z"/><path fill="#164daf" d="M0 60h300v60H0z"/><path fill="#d52b35" d="M0 120h300v60H0z"/></g></svg>`,japan:`<svg class="flag" viewBox="0 0 300 200"><rect width="300" height="200" fill="white"/><circle cx="150" cy="100" r="60" fill="#bc1733"/></svg>`};
const worlds={israel:{label:'Israel',name:'The Symbol Workshop',ground:'#75b8ca',accent:'#d5e6ea',desc:'Explore a workshop full of fabric, symbols and mysterious crates.',words:[['stripe','полоса'],['symbol','символ'],['shawl','шаль'],['inspire','вдохновлять']],facts:[['Tallit','A tallit is a Jewish prayer shawl. Its stripes helped inspire the design of the flag.'],['Star of David','The Star of David is a Jewish symbol. It has six points.'],['Flag story','Israel adopted this flag in 1948. It has two blue stripes and a blue star.']],items:['white fabric','blue stripes','star'],questions:[['A visitor says: “The blue stripes are two rivers.” What inspired them?',['A prayer shawl','A railway','Two rivers'],0],['How many points does the Star of David have?',['Four','Six','Eight'],1]]},russia:{label:'Russia',name:'The Ship of Colours',ground:'#68adbf',accent:'#c5e2e7',desc:'Search the harbour and board the ship. Find three stripes and investigate their story.',words:[['ship','корабль'],['stripe','полоса'],['horizontal','горизонтальный'],['tricolour','трёхцветный флаг']],facts:[['Ship’s log','A white, blue and red flag was used on Russian ships in the time of Peter the Great.'],['Three colours','Russia’s flag has three horizontal stripes: white, blue and red.'],['Different meanings','The tricolour returned as a Russian flag in 1991. People give the colours different meanings; there is no single official meaning.']],items:['white stripe','blue stripe','red stripe'],questions:[['Where was a white-blue-red flag used long ago?',['On ships','On the Moon','On a robot'],0],['What is the order from top to bottom?',['White, blue, red','Red, blue, white','Blue, red, white'],0]]},japan:{label:'Japan',name:'The Sun Portal',ground:'#8ec6ad',accent:'#d7ead6',desc:'Explore an island and find messages hidden among its blocky mountains.',words:[['island','остров'],['circle','круг'],['sun','солнце'],['represent','символизировать']],facts:[['Island map','Japan is an island country in East Asia. Its capital is Tokyo.'],['The red circle','The red circle on Japan’s flag represents the sun.'],['Hinomaru','The flag is called Hinomaru, meaning “sun circle”. A sun-circle symbol has a long history in Japan.']],items:['white field','red circle','sun key'],questions:[['What does the red circle represent?',['An apple','The sun','A ball'],1],['Which city is Japan’s capital?',['Tokyo','Rome','London'],0]]}};
function save(){try{localStorage.setItem('flag_glitch_v3',JSON.stringify(state))}catch(e){}}const audioFiles={"Hello explorer! Find the story blocks and objects. Then restore the flag!": "assets/audio/00.m4a", "A tallit is a Jewish prayer shawl. Its stripes helped inspire the design of the flag.": "assets/audio/01.m4a", "The Star of David is a Jewish symbol. It has six points.": "assets/audio/02.m4a", "Israel adopted this flag in 1948. It has two blue stripes and a blue star.": "assets/audio/03.m4a", "stripe": "assets/audio/04.m4a", "symbol": "assets/audio/05.m4a", "shawl": "assets/audio/06.m4a", "inspire": "assets/audio/07.m4a", "A visitor says: “The blue stripes are two rivers.” What inspired them?": "assets/audio/08.m4a", "How many points does the Star of David have?": "assets/audio/09.m4a", "A white, blue and red flag was used on Russian ships in the time of Peter the Great.": "assets/audio/10.m4a", "Russia’s flag has three horizontal stripes: white, blue and red.": "assets/audio/11.m4a", "The tricolour returned as a Russian flag in 1991. People give the colours different meanings; there is no single official meaning.": "assets/audio/12.m4a", "ship": "assets/audio/13.m4a", "horizontal": "assets/audio/14.m4a", "tricolour": "assets/audio/15.m4a", "Where was a white-blue-red flag used long ago?": "assets/audio/16.m4a", "What is the order from top to bottom?": "assets/audio/17.m4a", "Japan is an island country in East Asia. Its capital is Tokyo.": "assets/audio/18.m4a", "The red circle on Japan’s flag represents the sun.": "assets/audio/19.m4a", "The flag is called Hinomaru, meaning “sun circle”. A sun-circle symbol has a long history in Japan.": "assets/audio/20.m4a", "island": "assets/audio/21.m4a", "circle": "assets/audio/22.m4a", "sun": "assets/audio/23.m4a", "represent": "assets/audio/24.m4a", "What does the red circle represent?": "assets/audio/25.m4a", "Which city is Japan’s capital?": "assets/audio/26.m4a", "Which material can make the background?": "assets/audio/27.m4a", "Which colour are the stripes?": "assets/audio/28.m4a", "Which symbol belongs on the flag?": "assets/audio/29.m4a", "Read the label: WHITE. Which crate do you open?": "assets/audio/30.m4a", "The blue stripe is on the ship. What is a ship?": "assets/audio/31.m4a", "The red stripe is in the last box. Which colour is red?": "assets/audio/32.m4a", "What colour is the flag’s background?": "assets/audio/33.m4a", "Which shape represents the sun?": "assets/audio/34.m4a", "What is the capital of Japan?": "assets/audio/35.m4a"};let activeAudio=null;function stopAudio(){if(activeAudio){activeAudio.pause();activeAudio=null}if(window.speechSynthesis)speechSynthesis.cancel()}function say(t){stopAudio();const fallback=()=>{if(!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};if(!audioFiles[t]){fallback();return}const clip=new Audio(audioFiles[t]);activeAudio=clip;$('voice-player').replaceChildren(clip);clip.play().catch(e=>{if(activeAudio===clip&&e.name!=='AbortError')fallback()})}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(html){draftArt();stopAudio();keys={};document.querySelector('header').inert=true;document.querySelector('.wrap').inert=true;modal.hidden=false;modal.innerHTML=`<div class="box" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;modal.querySelector('.box').focus()}function hide(){draftArt();document.querySelector('header').inert=false;document.querySelector('.wrap').inert=false;modal.hidden=true;modal.innerHTML='';stopAudio();save();update()}
function setup(){show(`<h2>🧱 The Flag Museum is glitching!</h2><p class="story">The flags have vanished into three worlds. Explore the portals, discover their stories, and bring the flags back!</p><div class="intro">Move with <b>arrow keys / WASD</b>. Go near a glowing object and press <b>E</b> or <b>Space</b>. You can also click objects and use the arrow buttons.</div><p>Choose your explorer:</p><div class="row"><button onclick="state.avatar=0">🙂 Explorer</button><button onclick="state.avatar=1">😎 Explorer</button><label>Shirt <input type="color" value="${state.shirt}" onchange="state.shirt=this.value"></label></div><button onclick="hide()">Start exploring →</button><details><summary>Для преподавателя</summary><p>Около 45 минут: музей 3–5 мин, каждый мир 9–10 мин, собственный флаг 8–10 мин. Тексты появляются по одному; 🔊 воспроизводит готовую озвучку; при её недоступности используется голос браузера. Вопросы на обсуждение не требуют письма. Для онлайн-занятия ученик может давать команды учителю. Свободный переход между мирами и отсутствие таймера сохраняют гибкость урока.</p></details>`)}
function goto(s){state.scene=s;state.x=480;state.y=500;state.order=[];hide();save();update()}
function obj(id,x,y,label,kind,fn){objects.push({id,x,y,label,kind,fn})}function setObjects(){objects=[];if(state.scene==='museum'){obj('i',180,180,'ISRAEL','portal',()=>goto('israel'));obj('r',480,160,'RUSSIA','portal',()=>goto('russia'));obj('j',780,180,'JAPAN','portal',()=>goto('japan'));obj('robot',480,340,'ROBOT','robot',()=>robot());obj('gallery',755,390,'GALLERY','chest',gallery);obj('design',205,390,'CREATOR','brush',creator);return}let w=state.scene;obj('fact0',155,155,'READ 1','book',()=>fact(w,0));obj('fact1',480,115,'READ 2','book',()=>fact(w,1));obj('fact2',805,155,'READ 3','book',()=>fact(w,2));obj('item0',140,350,worlds[w].items[0].toUpperCase(),'crate',()=>item(w,0));obj('item1',480,315,worlds[w].items[1].toUpperCase(),'crate',()=>item(w,1));obj('item2',820,350,worlds[w].items[2].toUpperCase(),'crate',()=>item(w,2));obj('work',480,460,w==='israel'?'WORKSHOP':w==='russia'?'SHIP FLAG':'SUN GATE','station',()=>station(w));obj('side',750,475,w==='russia'?'PACK BAG':w==='israel'?'MY SYMBOL':'ISLAND TALK','npc',()=>side(w))}
function robot(){show(`<h2>🤖 Byte the museum bot</h2><p class="story">“Hello, Explorer! The Glitch has mixed up three flags. Choose any portal. Find three story blocks and three objects in each world. Then visit its flag station.”</p><div class="row"><button onclick="say('Hello explorer! Find the story blocks and objects. Then restore the flag!')">🔊 Listen</button><button onclick="hide()">Let’s go!</button></div><p>💬 Which world would you like to explore first? Why?</p>`)}
function fact(w,i){let f=worlds[w].facts[i];if(!state.seen[w].includes(i))state.seen[w].push(i);if(!state.notes.some(n=>n.key===w+i))state.notes.push({key:w+i,title:worlds[w].label+' · '+f[0],text:f[1]});show(`<h2>📖 ${f[0]}</h2><p class="story">${f[1]}</p><div class="row"><button onclick="say(worlds['${w}'].facts[${i}][1])">🔊 Listen</button><button onclick="hide()">Save to notebook ✓</button></div><p class="small">💬 Tell your teacher one thing you discovered.</p>`);save()}
function item(w,i){let entry=worlds[w].items[i];if(state.inv[w].includes(i)){show(`<h2>📦 Already collected!</h2><p>You have <b>${entry}</b> in your inventory.</p><button onclick="hide()">Continue</button>`);return}let challenges={israel:[['Which material can make the background?',['white fabric','a red ball','a green leaf'],0],['Which colour are the stripes?',['green','blue','orange'],1],['Which symbol belongs on the flag?',['a six-pointed star','a yellow moon','a red circle'],0]],russia:[['Read the label: WHITE. Which crate do you open?',['WHITE','BLUE','RED'],0],['The blue stripe is on the ship. What is a ship?',['a boat','a mountain','a tree'],0],['The red stripe is in the last box. Which colour is red?',['🟥 red','🟦 blue','⬜ white'],0]],japan:[['What colour is the flag’s background?',['white','green','blue'],0],['Which shape represents the sun?',['a red circle','a blue square','a green triangle'],0],['What is the capital of Japan?',['Tokyo','Madrid','Paris'],0]]};let c=challenges[w][i];show(`<h2>🔒 Object challenge</h2><div class="story">${c[0]}</div><div class="row"><button onclick="say(${JSON.stringify(c[0]).replace(/"/g,'&quot;')})">🔊 Listen</button></div><div class="options">${c[1].map((a,n)=>`<button onclick="answerItem('${w}',${i},${n},${c[2]})">${a}</button>`).join('')}</div><p id="feedback" class="feedback"></p><button class="secondary" onclick="hide()">Explore first</button>`)}
function answerItem(w,i,n,correct){if(state.inv[w].includes(i))return;if(n!==correct){$('feedback').textContent='Look around or check your notebook, then try again.';return}state.inv[w].push(i);save();show(`<h2>⭐ Item found!</h2><p class="story">You collected <b>${worlds[w].items[i]}</b>.</p><p>Inventory: ${state.inv[w].length} / 3</p><button onclick="hide()">Keep exploring →</button>`)}
function station(w){let d=worlds[w];if(state.done[w]){show(`<h2>🏆 ${d.label} restored!</h2><div class="frame">${flags[w]}</div><p>Your flag is in the museum gallery.</p><button onclick="hide()">Continue</button>`);return}if(state.inv[w].length<3||state.seen[w].length<3){show(`<h2>🛠 ${d.name}</h2><p>Find the missing items and stories before restoring this flag.</p><p>📦 Items: ${state.inv[w].length} / 3<br>📖 Story blocks: ${state.seen[w].length} / 3</p><button onclick="hide()">Back to exploring</button>`);return}state.order=[];assemble(w)}
function assemble(w){let o=w==='russia'?['white stripe','blue stripe','red stripe']:w==='israel'?['white fabric','blue stripes','star']:['white field','red circle','sun key'];let shuffled=w==='russia'?['red stripe','white stripe','blue stripe']:w==='israel'?['star','white fabric','blue stripes']:['red circle','sun key','white field'];show(`<h2>🛠 Restore the ${worlds[w].label} flag</h2><p>${w==='russia'?'Choose the stripes from top to bottom.':w==='israel'?'Choose background, stripes, then symbol.':'Choose the background and sun, then use the game key to open the portal. The key is not part of Japan’s flag.'}</p><div class="tiles">${shuffled.map(t=>`<button onclick="choosePiece('${w}','${t}')">${t}</button>`).join('')}</div><p>Selected: <b>${state.order.join(' → ')||'…'}</b></p><p id="feedback" class="feedback"></p><button class="secondary" onclick="state.order=[];assemble('${w}')">Reset</button> <button class="secondary" onclick="hide()">Back</button>`)}
function choosePiece(w,t){let correct=w==='russia'?['white stripe','blue stripe','red stripe']:w==='israel'?['white fabric','blue stripes','star']:['white field','red circle','sun key'];if(correct[state.order.length]!==t){$('feedback').textContent='Try a different piece. Your notebook can help!';return}state.order.push(t);if(state.order.length<3){assemble(w);return}question(w,0)}function question(w,i){if(i>=worlds[w].questions.length){state.done[w]=true;save();show(`<h2>🌟 Flag restored!</h2><div class="frame">${flags[w]}</div><p>You repaired the ${worlds[w].label} flag. It is now in your museum gallery.</p><p>💬 Describe the flag. What did you learn about its story?</p><div class="row"><button onclick="hide()">Explore this world</button><button onclick="goto('museum')">Return to museum →</button></div>`);return}let q=worlds[w].questions[i];show(`<h2>🧩 Final challenge ${i+1} / 2</h2><div class="story">${q[0]}</div><div class="row"><button onclick="say(worlds['${w}'].questions[${i}][0])">🔊 Listen</button></div><div class="options">${q[1].map((a,n)=>`<button onclick="checkQ('${w}',${i},${n})">${a}</button>`).join('')}</div><p id="feedback" class="feedback"></p><button class="secondary" onclick="hide()">Explore more</button>`)}function checkQ(w,i,n){if(n===worlds[w].questions[i][2])question(w,i+1);else $('feedback').textContent='Try again. What did the story say?'}
function side(w){if(w==='russia'){show(`<h2>🎒 Pack the ship</h2><p>Pick any three things. Explain your choices — even a giant pillow can be useful!</p><div class="tiles">${['map','water','telescope','boots','sandwich','giant pillow'].map(x=>`<button onclick="pack('${x}')">${x}</button>`).join('')}</div><p id="pack">Chosen: ${state.packed.join(', ')||'…'}</p><div class="story">I need … because …<br>We can use it to …</div><button onclick="hide()">Done</button>`)}else if(w==='israel'){show(`<h2>✨ Your own symbol</h2><p>Choose a symbol for a place that is important to you. What could it mean?</p><div class="row">${['⭐','🌳','🏠','☀️','🐈','🌊'].map(x=>`<button onclick="state.symbol='${x}';document.getElementById('symbol').textContent='My symbol: ${x}';save()">${x}</button>`).join('')}</div><p id="symbol">My symbol: ${state.symbol||'…'}</p><p class="story">My symbol is … It means …</p><button onclick="hide()">Save symbol</button>`)}else show(`<h2>🏝 Island explorer</h2><p class="story">Japan is an island country. How would you travel between islands?</p><div class="row"><button onclick="document.getElementById('feedback').textContent='A boat! Where will you go?'">⛵ Boat</button><button onclick="document.getElementById('feedback').textContent='A plane! What can you see below?'">✈️ Plane</button><button onclick="document.getElementById('feedback').textContent='A bridge! What would your bridge look like?'">🌉 Bridge</button></div><p id="feedback" class="feedback"></p><p>💬 What would you like to see on an island?</p><button onclick="hide()">Continue</button>`)}function pack(x){if(state.packed.includes(x))state.packed=state.packed.filter(a=>a!==x);else if(state.packed.length<3)state.packed.push(x);$('pack').textContent='Chosen: '+(state.packed.join(', ')||'…');save()}
function notebook(){show(`<h2>📓 Explorer’s notebook</h2><p>All your story blocks are saved here.</p><div class="book">${state.notes.length?state.notes.map(n=>`<p><b>${escapeHtml(n.title)}</b><br>${escapeHtml(n.text)}</p>`).join(''):'<p>No stories yet. Explore a portal!</p>'}</div><div class="row"><button onclick="hide()">Close</button></div>`)}function gallery(){show(`<h2>🏛 Museum gallery</h2><div class="row">${Object.keys(worlds).map(w=>`<div><b>${worlds[w].label}</b><br><div class="frame">${state.done[w]?flags[w]:'<p style="text-align:center;color:#637c80">MISSING</p>'}</div></div>`).join('')}</div><p>Your symbol: ${escapeHtml(state.symbol)||'not created yet'} · Your flag: ${state.design?'created!':'waiting for you'}</p>${state.design?`<h3>${escapeHtml(state.name||'My country')}</h3><img class="own-flag" src="${state.design}" alt="Your own flag">`:''}${Object.values(state.done).filter(Boolean).length===3?'<p class="finish">All three flags restored! The museum is complete. 🎉</p>':''}<button onclick="hide()">Continue exploring</button>`)}
function creator(){show(`<h2>🎨 Create your own flag</h2><p>Make a flag for a real or imaginary country. Draw or add a symbol!</p><div class="row"><label>Country: <input id="countryname" placeholder="My country" value="${escapeHtml(state.name)}"></label><label>Colour: <input id="colour" type="color" value="#2475b6"></label></div><div class="row"><button onclick="tool='pen'">✏️ Pen</button><button onclick="tool='star'">⭐ Star</button><button onclick="tool='sun'">☀️ Sun</button><button onclick="tool='heart'">♥ Heart</button><button onclick="tool='stripe'">▬ Stripe</button><button class="secondary" onclick="undoArt()">Undo</button><button class="secondary" onclick="clearArt()">Clear</button></div><canvas class="workcanvas" id="drawing" width="900" height="500"></canvas><p>💬 My country is called … My flag has … The symbol means …</p><div class="row"><button onclick="saveArt()">Save to gallery</button><button onclick="downloadArt()">Download picture ↓</button><button class="secondary" onclick="hide()">Close</button></div>`);initArt()}
let tool='pen',artCtx,drawCanvas,drawing=false,undo=[],artVersion=0;function draftArt(){if($('drawing')&&drawCanvas&&drawCanvas.dataset.ready==='yes'){state.name=$('countryname').value;state.design=drawCanvas.toDataURL();save()}}function initArt(){drawCanvas=$('drawing');artCtx=drawCanvas.getContext('2d');artCtx.fillStyle='#fff';artCtx.fillRect(0,0,900,500);const localCanvas=drawCanvas,localCtx=artCtx,version=++artVersion;localCanvas.dataset.ready=state.design?'no':'yes';if(state.design){let img=new Image();img.onload=()=>{if(version===artVersion&&localCanvas.isConnected){localCtx.drawImage(img,0,0);localCanvas.dataset.ready='yes'}};img.onerror=()=>{if(version===artVersion)localCanvas.dataset.ready='yes'};img.src=state.design}undo=[];let xy=e=>{let r=drawCanvas.getBoundingClientRect();return[(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*500/r.height]};drawCanvas.onpointerdown=e=>{e.preventDefault();if(drawCanvas.dataset.ready!=='yes')return;undo.push(artCtx.getImageData(0,0,900,500));if(undo.length>15)undo.shift();drawCanvas.setPointerCapture(e.pointerId);let[x,y]=xy(e);artCtx.fillStyle=artCtx.strokeStyle=$('colour').value;if(tool==='pen'){drawing=true;artCtx.lineWidth=9;artCtx.lineCap='round';artCtx.beginPath();artCtx.moveTo(x,y);artCtx.lineTo(x+.2,y+.2);artCtx.stroke()}else if(tool==='stripe')artCtx.fillRect(0,y-25,900,50);else{artCtx.font='bold 100px sans-serif';artCtx.textAlign='center';artCtx.fillText({star:'★',sun:'☀',heart:'♥'}[tool],x,y)}};drawCanvas.onpointermove=e=>{if(drawing){let[x,y]=xy(e);artCtx.lineTo(x,y);artCtx.stroke()}};drawCanvas.onpointerup=drawCanvas.onpointercancel=drawCanvas.onlostpointercapture=()=>{drawing=false;draftArt()};$('countryname').oninput=()=>{state.name=$('countryname').value;save()}}function undoArt(){if(undo.length){artCtx.putImageData(undo.pop(),0,0);draftArt()}}function clearArt(){if(confirm('Clear your drawing?')){undo.push(artCtx.getImageData(0,0,900,500));artCtx.fillStyle='white';artCtx.fillRect(0,0,900,500);++artVersion;drawCanvas.dataset.ready='yes';draftArt()}}function saveArt(){if(drawCanvas.dataset.ready!=='yes')return;draftArt();gallery()}function downloadArt(){draftArt();drawCanvas.toBlob(blob=>{if(!blob)return;let a=document.createElement('a'),url=URL.createObjectURL(blob);a.download='my_country_flag.png';a.href=url;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)},'image/png')}
function update(){setObjects();$('world-art').className='world-art scene-'+state.scene;$('world-art').setAttribute('aria-label',state.scene==='museum'?'The flag museum':worlds[state.scene].name);$('destinations').innerHTML=objects.map((o,i)=>`<button class="secondary" onclick="objects[${i}].fn()">${escapeHtml(o.label)}</button>`).join('');$('place').textContent=state.scene==='museum'?'🏛 MUSEUM':'🌍 '+worlds[state.scene].label.toUpperCase();$('progress').textContent='Flags '+Object.keys(state.done).filter(k=>state.done[k]).length+' / 3';if(state.scene==='museum'){$('title').textContent='The Flag Museum';$('description').textContent='Find the portals, meet Byte, and restore the missing flags.';$('mission').textContent='Explore any portal. Walk close and press E, or click it.';$('vocab').innerHTML='';$('collected').innerHTML=''}else{let w=worlds[state.scene];$('title').textContent=w.name;$('description').textContent=w.desc;$('mission').innerHTML=`Find 3 story blocks and 3 objects. Then visit the flag station.<br>📖 ${state.seen[state.scene].length} / 3 &nbsp; 📦 ${state.inv[state.scene].length} / 3 ${state.done[state.scene]?' &nbsp; ⭐ Complete!':''}`;$('vocab').innerHTML=w.words.map(([a,b])=>`<button class="secondary" onclick="say('${a}');this.textContent='${a} — ${b}'">${a} ?</button>`).join('');$('collected').innerHTML='<p><b>Inventory:</b> '+(state.inv[state.scene].map(i=>w.items[i]).join(', ')||'empty')+'</p>'}}
function block(x,y,w,h,c){ctx.fillStyle='rgba(0,0,0,.17)';ctx.fillRect(x+6,y+8,w,h);ctx.fillStyle=c;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,.19)';ctx.fillRect(x,y,w,7);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x+w-8,y,8,h)}function draw(){ctx.fillStyle=state.scene==='museum'?'#7fb6bf':worlds[state.scene].ground;ctx.fillRect(0,0,960,600);ctx.fillStyle=state.scene==='museum'?'#bcd4c7':'#b7d2ab';ctx.fillRect(28,30,904,540);for(let y=34;y<570;y+=60)for(let x=34;x<930;x+=60){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.strokeRect(x,y,60,60)}if(state.scene==='russia'){block(340,270,300,135,'#9b684b');block(366,240,250,50,'#b7875d')}if(state.scene==='japan'){for(let x of [80,590,840]){block(x,230,70,50,'#679775');block(x+15,200,40,36,'#518a67')}}if(state.scene==='israel'){block(338,245,280,100,'#aebfcd')}
for(let o of objects){let seen=o.id.startsWith('fact')&&state.seen[state.scene]?.includes(+o.id.slice(-1));let got=o.id.startsWith('item')&&state.inv[state.scene]?.includes(+o.id.slice(-1));let c=o.kind==='portal'?'#326c94':o.kind==='book'?(seen?'#769a88':'#f5bb5a'):o.kind==='crate'?(got?'#8aa896':'#b88954'):o.kind==='station'?'#825c9a':o.kind==='robot'?'#718f9e':o.kind==='brush'?'#d68e66':'#7a9e99';ctx.beginPath();ctx.fillStyle=got||seen?'rgba(255,255,255,.16)':'rgba(255,232,130,.32)';ctx.arc(o.x,o.y,48+Math.sin(frame/20)*3,0,Math.PI*2);ctx.fill();block(o.x-28,o.y-27,56,54,c);ctx.font='27px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(({portal:'✦',book:'📖',crate:'📦',station:'⚙',robot:'🤖',chest:'🏆',brush:'🎨',npc:'💬'})[o.kind]||'✦',o.x,o.y+9);ctx.font='bold 13px system-ui';let tw=ctx.measureText(o.label).width;ctx.fillStyle='rgba(10,35,50,.82)';ctx.fillRect(o.x-tw/2-6,o.y+34,tw+12,21);ctx.fillStyle='white';ctx.fillText(o.label,o.x,o.y+49)}let x=state.x,y=state.y;ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y+22,25,10,0,0,7);ctx.fill();block(x-19,y-22,38,39,state.shirt);block(x-15,y-49,30,27,'#ecc3a0');ctx.fillStyle='#25313b';ctx.fillRect(x-10,y-39,4,4);ctx.fillRect(x+6,y-39,4,4);if(state.avatar===1){ctx.fillRect(x-12,y-40,10,7);ctx.fillRect(x+2,y-40,10,7);ctx.fillRect(x-2,y-38,4,2)}block(x-16,y+17,12,18,'#34495c');block(x+4,y+17,12,18,'#34495c');let near=nearest();$('near').textContent=near?'Press E / Space to open '+near.label+' · or click it':'Move near a glowing object and press E / Space, or click it.'}
function nearest(){return objects.map(o=>({o,d:Math.hypot(o.x-state.x,o.y-state.y)})).filter(a=>a.d<94).sort((a,b)=>a.d-b.d)[0]?.o}function interact(){let o=nearest();if(o)o.fn()}function loop(t){let dt=Math.min((t-last)/16||1,2);last=t;if(modal.hidden){let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx||dy){let k=Math.hypot(dx,dy);state.x=Math.max(45,Math.min(915,state.x+dx/k*3.5*dt));state.y=Math.max(70,Math.min(530,state.y+dy/k*3.5*dt))}frame++;draw()}requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(!modal.hidden){if(e.key==='Escape'){e.preventDefault();hide();$('help').focus()}if(e.key==='Tab'){const list=[...modal.querySelectorAll('button,input,summary')].filter(b=>!b.disabled);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','e','E'].includes(e.key))e.preventDefault();let k=e.key.toLowerCase();if((k==='e'||k===' ')&&!e.repeat)interact();keys[k.startsWith('arrow')?'Arrow'+k.slice(5,6).toUpperCase()+k.slice(6):k]=true});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();keys[k.startsWith('arrow')?'Arrow'+k.slice(5,6).toUpperCase()+k.slice(6):k]=false});window.addEventListener('blur',()=>keys={});canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*600/r.height;let o=objects.find(o=>Math.hypot(o.x-x,o.y-y)<45);if(o){state.x=o.x;state.y=Math.min(530,o.y+80);o.fn()}else{state.x=Math.max(45,Math.min(915,x));state.y=Math.max(70,Math.min(530,y))}};document.querySelectorAll('[data-dir]').forEach(b=>{let k={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.dir];b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=()=>keys[k]=false;b.onpointercancel=()=>keys[k]=false});$('interact').onclick=interact;$('notebook').onclick=notebook;$('help').onclick=setup;$('museum').onclick=()=>goto('museum');$('creator').onclick=creator;update();setup();requestAnimationFrame(loop);
</script></body></html>
