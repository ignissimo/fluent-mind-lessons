<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yesterday's Lie Quest</title><style>body{font:17px system-ui;background:radial-gradient(circle at top,#44306a,#151126);color:#f6efff;margin:0}main{max-width:850px;margin:25px auto;padding:20px}.panel{background:#251d3d;border:1px solid #8067ad;border-radius:22px;padding:26px}h1{font-size:36px}button{cursor:pointer;border:1px solid #9878c4;background:#4b356e;color:white;padding:12px;border-radius:12px;font:inherit}button:hover,.selected{background:#9469d4}button:disabled{opacity:.35}.nav{display:flex;justify-content:space-between;margin-top:25px}.chips,.grid{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.chips span,.card{padding:14px;background:#44325f;border-radius:12px}.card{flex:1;min-width:160px;text-align:left}.card b{display:block;font-size:24px}.muted{color:#c6b6d8}.row{padding:14px;background:#332748;margin:10px 0;border-radius:12px}.options{display:flex;gap:8px;margin-top:9px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.column{display:grid;gap:7px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory button{min-height:95px;font-size:13px;overflow-wrap:anywhere}textarea{width:100%;min-height:200px;box-sizing:border-box;background:#171128;border:1px solid #ad8cdb;border-radius:12px;color:white;padding:15px;font:17px/1.5 system-ui}.art{height:135px;border-radius:15px;background:linear-gradient(120deg,#674397,#235f73);display:grid;place-items:center;font-size:60px;margin:15px 0}.ok{color:#a9f5c4}.error{color:#ffc3a8}@media(max-width:550px){.memory{grid-template-columns:repeat(3,1fr)}.panel{padding:17px}}*{box-sizing:border-box}[hidden]{display:none!important}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #a9f5c4;outline-offset:3px}.options{flex-wrap:wrap}button{overflow-wrap:anywhere}.card{min-width:0}.episode-art{display:block;width:min(100%,480px);height:auto;margin:14px auto;border-radius:14px}.portrait{width:100%;height:auto;display:block;border-radius:8px;margin-bottom:12px}.card b{margin-bottom:8px}h1{font-size:clamp(25px,4vw,36px);margin:10px 0}footer{text-align:center;margin-top:20px;color:#c6b6d8}footer a{color:#bce7ff}.row button.selected{outline:2px solid #a9f5c4}.nav{gap:10px}#next-hint{color:#e0cbff}.memory{grid-template-columns:repeat(4,minmax(0,1fr))}.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.memory button{font-size:14px}.memory .muted{color:white}@media(min-width:700px){.episode-art{width:320px}.panel:has(.pair) .episode-art,.panel:has(.memory) .episode-art{width:200px}.panel:has(textarea) .episode-art{width:260px}}@media(max-width:550px){main{padding:12px;margin:10px auto}.memory{grid-template-columns:repeat(3,minmax(0,1fr))}.card{flex-basis:100%}.pair button{font-size:14px;padding:9px}} </style><main><div class="muted">FLUENT MIND ADVENTURES · <span id="count"></span></div><p id="storage-status" role="status" hidden></p><div class="panel" id="screen"></div><footer><small>Episode stills © Disney · Fan-made English lesson. <a href="https://thegeekywaffle.com/home/2021/8/15/owl-house-spoiler-recap-yesterdays-lie" target="_blank" rel="noopener">Image source</a></small></footer></main><script>
const words=[['pretend to be','act as if you are another person'],['fit in','feel accepted by a group'],['run away','leave to escape something'],['find out','discover information'],['tell the truth','say what really happened'],['feel guilty','feel bad about something you did'],["take someone’s place",'replace another person'],['keep a promise','do what you said you would do']];const facts=[['Vee wanted to hurt Luz by taking her place.',false],['Before Vee came home, Camila believed Luz was at summer camp.',true],['Luz returned to the Human Realm and stayed there.',false],['Vee was afraid of being captured again.',true],['Vee was pretending to be Luz.',true],['At the start of the episode, Camila knew about the Boiling Isles.',false]];const people={Luz:['🪞','A message to Camila','Explain why you stayed in the Demon Realm, what you regret, and what you want your mother to understand.','Mom, I know I hurt you, but...'],Vee:['🦎','A message to Luz','Explain why you took Luz’s place, what you feared, and what you hope will happen next.','Luz, I never wanted to steal your life...'],Camila:['💜','A message to Luz','Explain how you felt when you learned the truth, what worries you, and what you want for Luz.','Luz, when I discovered the truth...']};let page=0,person='Luz',writing='',mode='match',selected=null,matched=[],opened=[],done=[],busy=false,answers={},choice='';let order=[...words.keys()].sort(()=>Math.random()-.5),deck=words.flatMap((w,i)=>[{id:i,t:w[0]},{id:i,t:w[1]}]).sort(()=>Math.random()-.5);let drafts={Luz:'',Vee:'',Camila:''},memoryEpoch=0,memoryTimer=null;
function persist(){drafts[person]=writing;try{localStorage.setItem('yesterday-quest',JSON.stringify({page,person,writing,drafts,mode,matched,done,answers,choice,order,deck}))}catch(e){document.getElementById('storage-status').hidden=false;document.getElementById('storage-status').textContent='This browser cannot save progress. Keep this tab open and download your writing.'}}
function load(){try{let a=JSON.parse(localStorage.getItem('yesterday-quest')||'null');if(!a||typeof a!=='object')return;person=Object.hasOwn(people,a.person)?a.person:'Luz';for(const n of Object.keys(people))if(a.drafts&&typeof a.drafts[n]==='string')drafts[n]=a.drafts[n];if(typeof a.writing==='string'&&!drafts[person])drafts[person]=a.writing;writing=drafts[person];mode=a.mode==='memory'?'memory':'match';for(const [key,set] of [['matched',v=>matched=v],['done',v=>done=v]])set([...new Set((Array.isArray(a[key])?a[key]:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<8))]);answers={};for(let i=0;i<6;i++)if(typeof a.answers?.[i]==='boolean')answers[i]=a.answers[i];choice=['Yes','No','Compromise'].includes(a.choice)?a.choice:'';if(Array.isArray(a.order)&&a.order.length===8&&new Set(a.order).size===8&&a.order.every(i=>Number.isInteger(i)&&i>=0&&i<8))order=a.order;if(Array.isArray(a.deck)&&a.deck.length===16&&a.deck.every(v=>v&&Number.isInteger(v.id)&&v.id>=0&&v.id<8&&words[v.id].includes(v.t))&&new Set(a.deck.map(v=>v.id+':'+v.t)).size===16)deck=a.deck.map(v=>({id:v.id,t:v.t}));page=Number.isInteger(a.page)&&a.page>=0&&a.page<=5?a.page:0;while(page>0&&!canEnter(page))page--}catch(e){}}
function sentenceCount(){return (writing.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).filter(x=>x.trim()).length}
function ready(i){return i===1?matched.length===8||done.length===8:i===2?facts.every((f,j)=>answers[j]===f[1]):i===4?sentenceCount()>=5:true}
function canEnter(n){return Array.from({length:n},(_,i)=>i).every(ready)}
function resetMemory(){memoryEpoch++;if(memoryTimer!==null)clearTimeout(memoryTimer);memoryTimer=null;opened=[];busy=false}
function changeMode(m){resetMemory();mode=m;persist();draw()}
function choosePerson(n){persist();person=n;writing=drafts[n];persist();draw()}
function updateNav(){const b=document.getElementById('continue');if(b)b.disabled=page===5||!ready(page);const hint=document.getElementById('next-hint');if(hint)hint.textContent=ready(page)?'':page===1?'Complete Match OR Memory to continue.':page===2?'Correct all six statements to continue.':'Write at least five sentences before the final discussion.'}
function nav(){return `<div class="nav"><button onclick="go(-1)" ${page===0?'disabled':''}>← Back</button><button id="continue" onclick="go(1)" ${page===5||!ready(page)?'disabled':''}>Continue →</button></div>`}function go(d){if(d>0&&(!ready(page)||!canEnter(page+1)))return;resetMemory();page=Math.min(5,Math.max(0,page+d));persist();draw();scrollTo(0,0)}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function draw(){document.getElementById('count').textContent=`Mission ${page+1}/6`;let h='';if(page===0)h=`<h1>🪞 Yesterday's Lie</h1><p>Memory Portal · 3 minutes</p><p>Tell your teacher what happened. Use these seven clues:</p><div class="chips">${['Portal','Mirror','Vee','Camp','Magic','Camila','Promise'].map(w=>`<span>${w}</span>`).join('')}</div><p>How are these words connected? No writing needed!</p>`;if(page===1)h=`<h1>🔮 Vocabulary Lab</h1><p>Match the expressions to their English definitions. Or play Memory!</p><div class="options"><button onclick="changeMode('match')">Match</button><button onclick="changeMode('memory')">Memory</button></div><div id="game"></div>`;if(page===2)h=`<h1>🔍 Truth or Lie?</h1><p>Choose True or False. You can retry!</p>${facts.map((f,i)=>`<div class="row">${i+1}. ${f[0]}<div class="options"><button class="${answers[i]===true?'selected':''}" aria-pressed="${answers[i]===true}" onclick="check(${i},true)">True</button><button class="${answers[i]===false?'selected':''}" aria-pressed="${answers[i]===false}" onclick="check(${i},false)">False</button></div><div id="a${i}">${answers[i]===undefined?'':answers[i]===f[1]?'<span class="ok">Correct!</span>':'<span class="error">Try again!</span>'}</div></div>`).join('')}<p>Speaking: Which character had the hardest choice?</p>`;if(page===3)h=`<h1>🎭 Choose Your Truth</h1><p>Choose one character for your writing mission.</p><div class="grid">${Object.entries(people).map(([n,v])=>`<button class="card ${person===n?'selected':''}" onclick="choosePerson('${n}')"><img class="portrait" src="assets/${n==='Luz'?'luz-3':n==='Vee'?'vee-3':'camila-vee'}.jpg" alt="${n==='Luz'?imageAlt['luz-3']:n==='Vee'?imageAlt['vee-3']:imageAlt['camila-vee']}"><b>${v[0]} ${n}</b>${n==='Luz'?'Freedom vs family':n==='Vee'?'Safety vs honesty':'Love vs control'}</button>`).join('')}</div><p>What does ${person} want most? Explain aloud.</p>`;if(page===4){let p=people[person];h=`<h1>${p[0]} ${p[1]}</h1><p>${p[2]}</p><p>First discuss your ideas aloud. Then write <b>5–6 connected sentences</b>.</p><div class="row">Optional beginning: <i>${p[3]}</i><p class="muted">because · although · however · so · if</p></div><textarea id="writing" placeholder="Write your message here..." aria-label="Your message" oninput="writing=this.value;persist();stats();updateNav()">${esc(writing)}</textarea><p id="stats"></p><button onclick="download()">Save my writing (.txt)</button> <button onclick="copyWriting()">Copy text</button>`}if(page===5)h=`<h1>⚖️ The Final Choice</h1><p>Camila asks Luz to stay in the Human Realm when she comes home. Is it fair to ask Luz to make this promise?</p><div class="grid">${[['Yes','She needs to protect her daughter.'],['No','Luz should choose her own life.'],['Compromise','They should make a new agreement together.']].map(([v,t])=>`<button class="card ${choice===v?'selected':''}" onclick="choice='${v}';persist();draw()"><b>${v}</b>${t}</button>`).join('')}</div><p>Explain your choice aloud. Give one reason and one example.</p><div class="row">${choice&&canEnter(5)?'🎉 Quest complete! You can download your writing below.':'Choose a position, then explain your reason and example aloud.'}</div><button onclick="download()">Download my writing</button>`;const art=page===0?'luz-vee':page===1?'luz-3':page===2?'camila-vee':page===3?null:page===4?(person==='Luz'?'luz-3':person==='Vee'?'vee-3':'camila-vee'):'camila-luz';if(art)h=h.replace('</h1>',`</h1><img class="episode-art" src="assets/${art}.jpg" alt="${imageAlt[art]}">`);document.getElementById('screen').innerHTML=h+`<p id="next-hint" role="status"></p>`+nav();updateNav();if(page===1)game();if(page===4)stats()}
function check(i,v){answers[i]=v;persist();updateNav();document.getElementById('a'+i).closest('.row').querySelectorAll('button').forEach((b,j)=>{const chosen=v===(j===0);b.classList.toggle('selected',chosen);b.setAttribute('aria-pressed',String(chosen))});document.getElementById('a'+i).innerHTML=v===facts[i][1]?'<span class="ok">Correct!</span>':'<span class="error">Not quite. Try again.</span>'}function game(){let e=document.getElementById('game');if(mode==='match'){e.innerHTML=`<p>${matched.length}/8 matched</p><div class="pair"><div class="column">${words.map((w,i)=>`<button ${matched.includes(i)?'disabled':''} class="${selected===i?'selected':''}" aria-pressed="${selected===i}" onclick="selected=${i};game()">${w[0]}</button>`).join('')}</div><div class="column">${order.map(i=>`<button ${matched.includes(i)?'disabled':''} onclick="match(${i})">${words[i][1]}</button>`).join('')}</div></div><p id="response">Select a phrase, then its definition.</p>`}else{e.innerHTML=`<p>${done.length}/8 pairs found</p><div class="memory">${deck.map((v,i)=>`<button ${done.includes(v.id)?'disabled':''} aria-label="${done.includes(v.id)?'Matched: '+esc(v.t):opened.includes(i)?esc(v.t):'Hidden card '+(i+1)}" aria-pressed="${opened.includes(i)}" onclick="flip(${i})">${opened.includes(i)||done.includes(v.id)?v.t:'✦'}</button>`).join('')}</div>`}}function match(i){if(selected===null||matched.includes(i)||matched.includes(selected))return;if(selected===i){matched.push(i);selected=null;persist();game();updateNav()}else document.getElementById('response').textContent='Try another definition.'}function flip(i){if(page!==1||mode!=='memory'||busy||opened.includes(i)||done.includes(deck[i].id))return;opened.push(i);game();if(opened.length===2){if(deck[opened[0]].id===deck[opened[1]].id){done.push(deck[i].id);opened=[];persist();game();updateNav()}else{busy=true;const epoch=memoryEpoch;memoryTimer=setTimeout(()=>{if(epoch!==memoryEpoch)return;opened=[];busy=false;memoryTimer=null;if(page===1&&mode==='memory')game()},950)}}}function stats(){let count=sentenceCount();document.getElementById('stats').textContent=`${count} sentence(s) · ${(writing.trim().match(/\S+/g)||[]).length} words`}function download(){let blob=new Blob([`Yesterday's Lie — ${person}\n\n${writing}`],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Yesterdays_Lie_'+person+'_Writing.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function copyWriting(){try{if(!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(writing);document.getElementById('stats').textContent='Copied!'}catch(e){document.getElementById('writing').focus();document.getElementById('writing').select();document.getElementById('stats').textContent='Copy is unavailable. The text is selected: use Ctrl+C or Command+C.'}}
const imageAlt={'luz-vee':'Luz speaks to Vee through a reflection in a museum display.','luz-3':'Luz in the dark space between the Human and Demon Realms.','camila-vee':'Camila stands up for Vee, who is trapped in a cage.','vee-3':'Vee remembers being forced to take magic while held captive.','camila-luz':'Camila talks to a glowing image of Luz in the rain.'};
document.addEventListener('visibilitychange',()=>{if(document.hidden){resetMemory();if(page===1)game();persist()}});load();draw();</script></html>
