<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crack the Code</title><style>body{font-family:system-ui;background:#101e2b;color:#eef8fb;margin:0}main{max-width:850px;margin:auto;padding:22px}h1{color:#a6e8df}section{background:#203545;border:1px solid #446174;border-radius:18px;padding:22px;margin:16px 0}button{background:#315568;border:1px solid #6d9eaa;color:white;border-radius:12px;padding:12px 18px;font-size:18px;cursor:pointer;margin:5px}button:hover{background:#417486}button:disabled{opacity:.4}input{font-size:22px;padding:10px;max-width:85%;border-radius:9px}.big{font-size:42px;font-weight:700;margin:25px 0}.muted{color:#bed1d8}.ok{color:#9ef2c4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.card{background:#294455;padding:16px;border-radius:12px}#message{min-height:30px;font-weight:700}small{color:#b8ced6}</style><main><h1>🔓 CRACK THE CODE</h1><h2>The Secret Sound Lab</h2><p>Six levels • Sound helper • Achievements • No timers</p><div id="score">⭐ 0 XP</div><section id="screen"></section><small>🔊 Sound uses your browser's English speech voice. Press any speaker button to hear it again. IPA symbols are written on screen for reading practice.</small></main><script>
const levels=['Sound Scanner','Word Constructor','Robot Error','Sound Battle','Sentence Decoder','Final Vault'];const sounds=[['/æ/','A','cat'],['/ɪ/','I','pig'],['/ʃ/','SH','ship'],['/tʃ/','CH','chip'],['/f/','F','fan'],['/v/','V','van'],['/θ/','TH','thin'],['/ð/','TH','this']];const words=[['/ʃɪp/','ship'],['/tʃɪp/','chip'],['/fɪʃ/','fish'],['/væn/','van'],['/ðɪs/','this'],['/θɪn/','thin']];const errors=[['thin','/ðɪn/',false],['fish','/fɪʃ/',true],['van','/fæn/',false],['this','/ðɪs/',true],['chip','/ʃɪp/',false],['zip','/zɪp/',true]];const voices=[['/p/','OFF','pat'],['/b/','ON','bat'],['/k/','OFF','cap'],['/g/','ON','gap'],['/f/','OFF','fan'],['/v/','ON','van'],['/θ/','OFF','thin'],['/ð/','ON','this']];const sentences=['The fish is big.','This is a cat.','The dog is in the van.','Ben has a red bag.','The pig can run.'];const story=['This is Ben.','Ben has a big dog.','The dog can see a fish.','The fish is in a dish.'];let done=new Set(),ach=new Set(),xp=0,level=-1,i=0,tries=0,chosen=[],turn=0,locked=false;const el=document.getElementById('screen');function say(s){if(!('speechSynthesis'in window)){alert('Audio is unavailable in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.75;speechSynthesis.speak(u)}function score(){document.getElementById('score').textContent=`⭐ ${xp} XP • 🔑 ${done.size}/6 keys`};function home(){turn++;level=-1;score();el.innerHTML='<h2>Mission Control</h2><p>Choose a level. Take your time. Every try counts.</p><div class="grid">'+levels.map((n,j)=>`<button class="card" onclick="start(${j})">${done.has(j)?'✅':'🔒'} Level ${j+1}<br><b>${n}</b></button>`).join('')+'</div><h3>🏆 Achievements</h3><p>'+(Array.from(ach).join(' • ')||'Your badges will appear here!')+'</p>'}function start(n){level=n;i=0;tries=0;render()}function frame(title,body,helper){el.innerHTML=`<button onclick="home()">← Missions</button><h2>${title}</h2><p class="muted">Task ${i+1} of ${[8,6,6,8,5,4][level]}</p>${body}<p id="message"></p><button id="soundHelper">🔊 Sound helper</button><button onclick="hint()">💡 Hint</button><button onclick="next()">Skip →</button>`;document.getElementById('soundHelper').onclick=()=>say(helper)}function answer(ok){if(locked)return;if(ok){locked=true;xp+=tries===0?15:10;if(tries===0)ach.add('First Try Star');score();document.getElementById('message').innerHTML='<span class="ok">Correct! Code unlocked! ✓</span>';const currentTurn=turn;setTimeout(()=>{if(turn===currentTurn)next()},750)}else{tries++;document.getElementById('message').textContent='Not yet. Try again, or use the sound helper.'}}function next(){i++;tries=0;chosen=[];render()}function hint(){const hints=['Listen to the example word, then find its letters.','Read the IPA slowly from left to right.','Compare the first sound.','Touch your throat to feel voice ON or OFF.','Find who or what comes first.','Read one line at a time.'];document.getElementById('message').textContent=hints[level]}
function render(){turn++;locked=false;let totals=[8,6,6,8,5,4];if(i>=totals[level]){done.add(level);ach.add(['Sound Scout','Word Builder','Robot Mechanic','Voice Detective','Sentence Master','Vault Breaker'][level]);xp+=30;score();el.innerHTML=`<h2>🏆 Level complete!</h2><p class="big">🔑 KEY UNLOCKED</p><p>You earned an achievement!</p><button onclick="home()">Mission Control</button>`;return}if(level===0){let x=sounds[i];frame('🔎 Sound Scanner',`<p>Read the sound. Choose the letters.</p><div class="big">${x[0]}</div><div>${[x[1],['F','V','SH','CH','TH','A','I','Z'][i]].filter((v,k,a)=>a.indexOf(v)===k).map(v=>`<button onclick="answer('${v}'==='${x[1]}')">${v}</button>`).join('')}</div>`,x[2])}if(level===1){let x=words[i];frame('🧩 Word Constructor',`<p>Read the transcription. Write the word.</p><div class="big">${x[0]}</div><input id="write" autocomplete="off" spellcheck="false"><button onclick="answer(document.getElementById('write').value.trim().toLowerCase()==='${x[1]}')">Check</button>`,x[1])}if(level===2){let x=errors[i];frame('🤖 Robot Error',`<p>Is the transcription correct?</p><div class="big">${x[0]} → ${x[1]}</div><button onclick="answer(${x[2]})">RIGHT</button><button onclick="answer(${!x[2]})">WRONG</button>`,x[0])}if(level===3){let x=voices[i];frame('🎧 Sound Battle',`<p>Is the sound voiced or voiceless?</p><div class="big">${x[0]}</div><button onclick="answer('${x[1]}'==='OFF')">🤫 OFF</button><button onclick="answer('${x[1]}'==='ON')">🐝 ON</button>`,x[2])}if(level===4){let x=sentences[i],parts=x.split(' '),order=[...parts].reverse();frame('🧱 Sentence Decoder',`<p>Tap the words in the right order. Then read aloud.</p><div id="built" class="card" style="min-height:45px;font-size:25px"></div><div id="tiles">${order.map((w,j)=>`<button id="tile${j}" onclick="pick(${j},this.textContent)">${w}</button>`).join('')}</div><button onclick="answer(chosen.join(' ')==='${x}')">Check sentence</button><button onclick="chosen=[];render()">Clear</button>`,x)}if(level===5){let x=story[i];frame('🔐 Final Vault',`<p>Read this secret line aloud, then press DONE.</p><div class="big" style="font-size:31px">${x}</div><button onclick="answer(true)">✓ I read it!</button>`,x)}}function pick(j,w){chosen.push(w);document.getElementById('tile'+j).disabled=true;document.getElementById('built').textContent=chosen.join(' ')}home();</script></html>
