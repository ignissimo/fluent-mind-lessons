<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse Lake Quest</title><style>body{margin:0;background:#11152d;color:#f5f1ff;font:17px system-ui}main{max-width:850px;margin:auto;padding:22px}h1{font-size:40px}h2{color:#e7cafa}.card{background:#222947;border:1px solid #57628c;border-radius:20px;padding:24px;margin:16px 0}.art{width:100%;height:210px;border-radius:15px;background:#191d38}button{border:0;border-radius:12px;background:#c6b0ff;color:#1b1635;font-weight:700;padding:12px 18px;cursor:pointer;margin:5px}button:hover{background:#e6d8ff}.choice{background:#3a4168;color:white;border:2px solid #6d79a0}.chosen{border-color:#ffdb8d;background:#5a4475}textarea{width:100%;min-height:85px;background:#10182e;border:1px solid #7581ae;border-radius:12px;color:white;padding:12px;font:inherit;box-sizing:border-box}label{display:block;margin:16px 0 6px;font-weight:700}.tag{display:inline-block;background:#41486e;padding:7px 12px;border-radius:30px;margin:5px}.muted{color:#c1c6df}.bar{display:flex;gap:5px}.bar i{flex:1;height:7px;border-radius:5px;background:#424a6e}.bar i.on{background:#c6b0ff}.question{background:#30385b;padding:15px;border-radius:12px;margin:12px 0}.feedback{color:#a9efcf}.small{font-size:14px}*{box-sizing:border-box}body{line-height:1.55}h1{line-height:1.15;margin:18px 0}.episode-art{margin:0 0 18px;position:relative;background:#10162b;border:1px solid #57628c;border-radius:14px;overflow:hidden}.episode-art .art{height:auto;max-height:260px;object-fit:contain;display:block;border-radius:0}.episode-art figcaption{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;color:#e7d9ff;font-size:12px;letter-spacing:.06em}.episode-art figcaption span{color:#c1c6df;font-size:10px}button{font-size:15px;line-height:1.4}button:focus-visible,textarea:focus-visible{outline:3px solid #ffdb8d;outline-offset:3px}.credits{max-width:850px;margin:12px auto 24px;text-align:center;color:#c1c6df;font-size:11px;padding:0 20px}.credits a{color:#e7cafa}#print-report{display:none}#storage-note{border:1px solid #ffdb8d;padding:10px;border-radius:8px}@media(max-width:600px){main{padding:12px}.card{padding:16px}h1{font-size:32px}h2{font-size:24px}.episode-art .art{max-height:200px}.episode-art figcaption{flex-wrap:wrap}button{max-width:100%}}@media print{body{background:white;color:black}main,.credits{display:none}#print-report{display:block;padding:20px}#print-report h1{font-size:24px}#print-report h2{color:black;font-size:16px;break-after:avoid}#print-report p{white-space:pre-wrap;overflow-wrap:anywhere}}
</style><main><div class="small">✦ FLUENT MIND ADVENTURES · THE OWL HOUSE S2E9</div><div class="bar" id="bar"></div><p id="storage-note" class="muted small" role="status" hidden>Your browser cannot save progress. Download your writing before closing this lesson.</p><div id="app"></div></main><section id="print-report"></section><p class="credits">Unofficial educational fan lesson · The Owl House, “Eclipse Lake” © Disney · <a href="https://thegeekywaffle.com/home/2021/8/9/owl-house-spoiler-recap-eclipse-lake">Frame source</a> · Fluent Mind Adventures</p><script>
const art=(name)=>{const key={AMITY:'amity',HUNTER:'hunter',EDA:'eda'}[name]||'team',alts={amity:'Amity hugs Luz after her journey.',hunter:'Hunter at Eclipse Lake.',eda:'Eda carries Amity and King through the cavern.',team:'Amity, Eda, King and Hunter in the cavern.'};return `<figure class="episode-art"><img class="art" src="assets/${key}.jpg" alt="${alts[key]}"><figcaption>${name==='ECLIPSE LAKE'?'One lake. Three journeys.':name+"’S JOURNEY"}<span>Fluent Mind Adventures</span></figcaption></figure>`};
const routes={Amity:{read:'Luz is sick, so Amity travels to Eclipse Lake with Eda and King. She hopes to find Titan’s blood and help Luz. Amity also wants to prove that she is a good girlfriend. At the lake she meets Hunter, who desperately needs the same thing. They fight over the portal key. Amity learns that love is not something she has to earn by being perfect.',q:['Why does Amity want to find Titan’s blood?','What does Amity learn about love and trust?'],idea:'Amity wants to prove she is good enough. Does she need to?',start:'At first, Amity thinks ___. However, she learns ___.'},Hunter:{read:'Hunter goes to Eclipse Lake to find Titan’s blood for Emperor Belos. He is terrified of failing his mission. He believes that his position and his value depend on his success. He meets Amity and fights her for the portal key. Hunter’s fear helps us understand why he makes desperate decisions.',q:['Why is Hunter afraid of failing?','How are Hunter and Amity similar?'],idea:'Does failing a mission make someone a failure?',start:'Hunter wants ___ because ___. I think he feels ___.'},Eda:{read:'Eda travels to Eclipse Lake with Amity and King to help Luz. After her experience with the Owl Beast, her magic has changed. She must learn how to use her new abilities. During the journey, she cannot solve everything alone. The adventure shows that teamwork and accepting change can be important strengths.',q:['What is different about Eda’s magic?','Why does Eda need to work with others?'],idea:'Is asking for help a weakness or a strength?',start:'Eda used to ___. Now she ___. This shows ___.'}};
let page=0,character='Amity',answers={},checks={};
function readSaved(key){try{const v=JSON.parse(localStorage.getItem(key)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
answers=Object.fromEntries(Object.entries(readSaved('eclipse_answers')).filter(([k,v])=>typeof v==='string'));
const progress=readSaved('eclipse_progress');if(Number.isInteger(progress.page)&&progress.page>=0&&progress.page<=5)page=progress.page;if(Object.hasOwn(routes,progress.character))character=progress.character;if(progress.checks&&typeof progress.checks==='object'&&!Array.isArray(progress.checks))checks=Object.fromEntries(Object.entries(progress.checks).filter(([k,v])=>['0','1','2','3'].includes(k)&&['want','wants','of','for','travels','travel','meets','meet'].includes(v)));
function save(){try{localStorage.setItem('eclipse_answers',JSON.stringify(answers));localStorage.setItem('eclipse_progress',JSON.stringify({page,character,checks}))}catch(e){document.getElementById('storage-note').hidden=false}}
const escapeText=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const app=document.getElementById('app');const ta=(id,title)=>`<label for="${id}">${title}</label><textarea id="${id}" data-id="${id}" placeholder="Write here...">${escapeText(answers[id]||'')}</textarea>`;const nav=(prev=true,next=true)=>`<p>${prev?'<button onclick="go(-1)">← Back</button>':''}${next?'<button onclick="go(1)">Continue →</button>':''}</p>`;function go(n){page=Math.max(0,Math.min(5,page+n));render();scrollTo(0,0)}function pick(c){character=c;render()}function render(){save();document.getElementById('bar').innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<=page?'on':''}"></i>`).join('');let s='';if(page===0)s=`${art('ECLIPSE LAKE')}<h1>🌘 Choose Your Quest</h1><p>One lake. Three different journeys. Read, write, solve and create!</p><p class="muted">25 minutes · writing + reading + grammar + speaking</p>${nav(false)}`;if(page===1)s=`${art('ECLIPSE LAKE')}<h2>🧠 1. Memory Portal</h2><p>Use these seven clues to retell the episode to your teacher. Speak first!</p>${['Titan’s blood','portal key','sick Luz','Amity','Hunter','Eclipse Lake','wild magic'].map(x=>`<span class="tag">${x}</span>`).join('')}${ta('warm','Write ONE sentence about the most important event.')}${nav()}`;if(page===2)s=`${art('ECLIPSE LAKE')}<h2>🔮 2. Choose Your Story</h2><p>Which storyline did you find most interesting?</p>${Object.keys(routes).map(c=>`<button aria-pressed="${character===c}" class="choice ${character===c?'chosen':''}" onclick="pick('${c}')">${c==='Amity'?'💜':c==='Hunter'?'🗝️':'🦉'} ${c}</button>`).join('')}<p class="muted">Your next reading and writing tasks will change with your choice.</p>${nav()}`;if(page===3){let r=routes[character];s=`<h2>📖 3. ${character}'s Journey</h2>${art(character.toUpperCase())}<p>${r.read}</p><p><strong>Talk first:</strong> ${r.q[0]}</p>${ta('one_'+character,'Write 2 sentences answering: '+r.q[1])}<div class="question"><strong>Big question:</strong> ${r.idea}</div><p class="muted">Useful starter: ${r.start}</p>${ta('two_'+character,'Write your opinion in 2–3 sentences. Use because or however.')}${nav()}`;}if(page===4){const questions=[['Amity ___ to help Luz.','want','wants','wants'],['Hunter was afraid ___ failing.','of','for','of'],['Eda and King ___ with Amity.','travels','travel','travel'],['Amity ___ Hunter at the lake.','meets','meet','meets']];s=`${art(character.toUpperCase())}<h2>🧩 4. Grammar & Vocabulary</h2><p>Choose the correct answer. Then say why it is correct.</p>${questions.map((q,i)=>`<div class="question">${i+1}. ${q[0]}<br>${[q[1],q[2]].map(o=>`<button aria-pressed="${checks[i]===o}" class="choice ${checks[i]===o?'chosen':''}" onclick="checks[${i}]='${o}';render()">${o}</button>`).join('')}${checks[i]?`<div class="feedback" role="status">${checks[i]===q[3]?'✓ Correct!':'Try again.'}</div>`:''}</div>`).join('')}<h3>Connect the ideas</h3><p>Amity wants to help Luz. She is afraid of disappointing her. <strong>(but)</strong></p>${ta('grammar','Combine these ideas into ONE sentence using “but”.')}<p><strong>Useful phrases:</strong> <span class="tag">prove yourself</span><span class="tag">be afraid of</span><span class="tag">give up</span><span class="tag">trust someone</span></p>${nav()}`;}if(page===5)s=`${art(character.toUpperCase())}<h2>🎨 5. Creative Finale</h2><p>Imagine you could invent a magical object that would help ${character}. What would it do?</p><p><strong>Draw it on paper</strong> (or describe it to your teacher). Give it a name and explain your idea aloud.</p>${ta('final','Write only ONE sentence: “My magical object can…”')}<div class="question"><strong>Final speaking challenge:</strong> Would your object really solve ${character}'s problem? Why or why not?</div><button onclick="download()">⬇ Save my writing (.txt)</button><button onclick="printWriting()">🖨 Print</button>${nav(true,false)}<p class="muted small">You finished the Eclipse Lake Quest! ✨</p>`;app.innerHTML=`<section class="card">${s}</section>`;document.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',e=>{answers[e.target.dataset.id]=e.target.value;save()}))}function writingLabel(key){if(key==='warm')return 'Most important event';if(key==='grammar')return 'Connect the ideas using but';if(key==='final')return 'My magical object';if(key.startsWith('one_'))return key.slice(4)+' — reading response';if(key.startsWith('two_'))return key.slice(4)+' — my opinion';return key}
function preparePrint(){const report=document.getElementById('print-report');report.replaceChildren();const h=document.createElement('h1');h.textContent='Eclipse Lake — '+character;report.append(h);for(const [key,value] of Object.entries(answers)){const title=document.createElement('h2'),p=document.createElement('p');title.textContent=writingLabel(key);p.textContent=value;report.append(title,p)}const credit=document.createElement('p');credit.textContent='Fluent Mind Adventures';report.append(credit)}
function printWriting(){preparePrint();window.print()}
window.addEventListener('beforeprint',preparePrint);
function download(){let lines=['ECLIPSE LAKE — '+character,''];for(const [k,v] of Object.entries(answers))lines.push(writingLabel(k)+': '+v,'');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='Eclipse_Lake_Writing.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></html>
