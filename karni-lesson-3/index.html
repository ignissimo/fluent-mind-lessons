const key='karni_english_lesson3_v1';
const ids=SECTIONS.flatMap((s,i)=>s.items.map((_,j)=>i+'-'+j));
let sec=0,idx=0,view='theory',saved={},attempts={},storage=true,speech=null;
const el=id=>document.getElementById(id);
const current=()=>SECTIONS[sec].items[idx];
const id=()=>sec+'-'+idx;
try{
 const data=JSON.parse(localStorage.getItem(key)||'{}');
 const valid=data && typeof data==='object' && !Array.isArray(data);
 if(valid){
  for(const k of ids)if(data[k]===true)saved[k]=true;
  const p=data.position;
  if(p&&Number.isInteger(p.sec)&&Number.isInteger(p.idx)&&SECTIONS[p.sec]?.items[p.idx]&&['theory','quiz','summary'].includes(p.view)){
   ({sec,idx,view}=p);
  }
 }
}catch{}
function persist(){
 try{localStorage.setItem(key,JSON.stringify({...saved,position:{sec,idx,view}}));storage=true}
 catch{storage=false}
}
function stopSpeech(){speech=null;window.speechSynthesis?.cancel()}
function speak(t){
 const status=el('audio-status');
 const unavailable=()=>{status.textContent='Audio is unavailable here. Read the text aloud together.'};
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){unavailable();return}
 try{
  stopSpeech();status.textContent='';
  const u=new SpeechSynthesisUtterance(t.replace(/___/g,' blank '));
  u.lang='en-US';u.rate=.82;u.onerror=()=>{if(speech===u)unavailable()};
  speech=u;window.speechSynthesis.speak(u)
 }catch{unavailable()}
}
const button=(action,label,disabled=false,extra='')=>`<button type="button" data-action="${action}" ${disabled?'disabled':''} ${extra}>${label}</button>`;
function render(focus=false){
 stopSpeech();persist();
 const done=Object.keys(saved).length,s=SECTIONS[sec];
 el('status').textContent=`${done} / ${ids.length} questions completed · Section ${sec+1} of ${SECTIONS.length}`;
 const progress=el('progress');
 progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Questions completed');
 progress.setAttribute('aria-valuemax',ids.length);progress.setAttribute('aria-valuenow',done);
 progress.firstElementChild.style.width=100*done/ids.length+'%';
 el('nav').innerHTML=SECTIONS.map((s,i)=>`<button type="button" data-section="${i}" ${i===sec?'class="active" aria-current="step"':''}>${i+1}. ${s.title}</button>`).join('');
 let panel;
 if(view==='theory'){
  panel=`<div class="tag">LESSON SLIDE · ${sec+1} / ${SECTIONS.length}</div>
  <h2 tabindex="-1">${s.title}</h2><div class="panel theory">${s.theory}</div>
  <p>Read the rule aloud and give one example. You can return to the rule any time.</p>
  <div class="controls">${button('listen-rule','🔊 Listen to the rule')}${button('start',idx?'Continue practice →':'Start practice →',false,'class="active"')}</div>`;
 }else if(view==='summary'){
  panel=`<h2 tabindex="-1">${done===ids.length?'Lesson complete!':'Lesson review'}</h2>
  <p>You answered ${done} of ${ids.length} questions correctly. ${done===ids.length?'Choose any section above to review it or practise again.':'You can return to the first question you skipped or still need to correct.'}</p>
  <div class="controls">${button('previous','← Last question')}${done<ids.length?button('unfinished','Go to first unfinished question →'):''}</div>`;
 }else{
  const q=current(),k=id(),finished=!!saved[k],st=attempts[k];
  const offset=q.opts.length===2?0:(q.a-(sec+idx)%q.opts.length+q.opts.length)%q.opts.length;
  const options=q.opts.map((_,n)=>{const i=(offset+n)%q.opts.length;
   return `<button type="button" data-choice="${i}" class="${finished&&i===q.a?'correct':st===i?'wrong':''}" ${finished?'disabled':''}>${String.fromCharCode(65+n)}. ${q.opts[i]}</button>`;
  }).join('');
  panel=`<div class="tag">${s.title} · Question ${idx+1} of ${s.items.length}</div>
  <h2 class="question" tabindex="-1">${q.q}</h2>
  <div class="controls">${button('question','🔊 Read question &amp; answers')}${button('rule','📖 Review the rule')}</div><p>Choose the best answer.</p>
  <div class="options">${options}</div>
  <div id="feedback" role="status" class="${finished||st!==undefined?'feedback':''}">${finished?'✓ Correct! '+q.why:st!==undefined?'Not quite. Try another answer or review the rule.':''}</div>
  <div class="controls">${button('previous','← Previous',sec===0&&idx===0)}
  ${button('next',idx===s.items.length-1?(sec===SECTIONS.length-1?'See result →':'Next section →'):'Next →')}
  ${button('explanation','🔊 Listen to explanation',!finished)}
  ${button('notebook','✏️ Optional notebook',false,'aria-expanded="false" aria-controls="notebook"')}
  ${finished?button('retry','Try this question again'):''}</div>
  <p id="notebook" hidden>${sec<2?'Write one sentence about this fact in your own words.':'Write one example using a rule or word from this question.'}</p>`;
 }
 el('main').innerHTML=`<div class="panel">${panel}<p id="audio-status" role="status"></p><p class="small">${storage?'Progress saves in this browser.':'Progress cannot be saved in this browser. Keep this page open while practising.'}</p></div>`;
 if(focus)el('main').querySelector('h2').focus();
}
function change(){render(true)}
el('nav').addEventListener('click',e=>{
 const b=e.target.closest('[data-section]');if(!b)return;
 const next=Number(b.dataset.section);if(next!==sec){sec=next;idx=0}view='theory';change()
});
el('main').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.choice!==undefined){
  if(view!=='quiz'||saved[id()])return;
  const i=Number(b.dataset.choice);
  if(i===current().a){saved[id()]=true;delete attempts[id()];render();el('main').querySelector('[data-action=next]').focus()}
  else {attempts[id()]=i;b.parentElement.querySelectorAll('button').forEach(o=>o.classList.toggle('wrong',o===b));const f=el('feedback');f.className='feedback';f.textContent='Not quite. Try another answer or review the rule.'}
  return;
 }
 switch(b.dataset.action){
 case 'start':view='quiz';change();break;
 case 'rule':view='theory';change();break;
 case 'listen-rule':speak(SECTIONS[sec].theory);break;
 case 'question':{const q=current();const options=[...el('main').querySelectorAll('[data-choice]')].map(o=>o.textContent);speak([q.q,...options].join('. '));break}
 case 'explanation':speak(current().why);break;
 case 'notebook':{const p=el('notebook');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));break}
 case 'retry':delete saved[id()];delete attempts[id()];change();break;
 case 'previous':
  if(view==='summary')view='quiz';
  else if(idx>0)idx--;
  else if(sec>0){sec--;idx=SECTIONS[sec].items.length-1}
  change();break;
 case 'next':
  if(idx+1<SECTIONS[sec].items.length)idx++;
  else if(sec+1<SECTIONS.length){sec++;idx=0;view='theory'}
  else view='summary';
  change();break;
 case 'unfinished':{
  const remaining=ids.find(k=>!saved[k]);if(remaining){[sec,idx]=remaining.split('-').map(Number);view='quiz';change()}break
 }
 }
});
render();
</script>
