<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English Challenge — Level 2</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243d;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:780px;margin:auto}header{background:#152b50;color:white;padding:28px;border-radius:20px;margin-bottom:20px}h1{margin:0 0 8px;font-size:2rem}header p{margin:0;color:#e0e8f6}.progress{height:10px;background:#dce3ee;border-radius:20px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#3c78d8;width:0;transition:width .2s}.card{background:white;border:1px solid #e2e7f0;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 3px 12px #152b5010}h2{font-size:1.13rem;margin:0 0 14px}.option{display:flex;align-items:center;gap:12px;border:2px solid #dce3ed;border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;min-height:48px}.option:hover{border-color:#789bce}.option:has(input:checked){border-color:#376fbd;background:#eef5ff}.option input{width:19px;height:19px;accent-color:#285db3}.feedback{font-weight:650;margin-top:12px}.good{color:#187447}.bad{color:#ae3b3b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}button{border:0;border-radius:12px;background:#173a71;color:white;padding:14px 20px;font-size:1rem;font-weight:700;cursor:pointer}button.secondary{background:#e2e9f3;color:#173a71}#result{font-size:1.15rem;font-weight:700}small{color:#57657b}.hidden{display:none}@media(max-width:550px){body{padding:12px}header{padding:22px}h1{font-size:1.5rem}.card{padding:16px}}</style></head><body><main class="wrap"><header><h1>🚀 English Challenge — Level 2</h1><p>Choose the best answer. Eight questions. Ready?</p></header><p id="count" aria-live="polite">0 of 8 answered</p><div class="progress"><div id="bar" class="bar"></div></div><div id="questions"></div><div class="actions"><button id="check" onclick="checkAnswers()">Check answers</button><button class="secondary" onclick="resetQuiz()">Try again</button></div><div id="result" role="status" aria-live="polite"></div><small>Teacher tip: Ask the student to explain their choices after checking. No typing required.</small></main><script>
const data=[
{q:'Which sentence is correct?',a:['My sister is more tall than me.','My sister is taller than me.','My sister is tallest than me.'],c:1},
{q:'We arrived ___ the airport at 8 o’clock.',a:['in','on','at'],c:2},
{q:'___ you see the film yesterday?',a:['Did','Were','Do'],c:0},
{q:'Which animal is the ___?',a:['most fast','faster','fastest'],c:2},
{q:'She is interested ___ science.',a:['on','in','at'],c:1},
{q:'Where ___ they go last weekend?',a:['did','were','do'],c:0},
{q:'This puzzle is ___ than the last one.',a:['more difficult','difficulter','most difficult'],c:0},
{q:'He didn’t ___ his homework.',a:['finished','finishes','finish'],c:2}
];
let selected={};let checked=false;
function render(){document.getElementById('questions').innerHTML=data.map((x,i)=>`<section class="card"><h2>${i+1}. ${x.q}</h2>${x.a.map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${selected[i]===j?'checked':''} onchange="choose(${i},${j})"><span><strong>${'ABC'[j]}.</strong> ${a}</span></label>`).join('')}<div class="feedback ${checked?(selected[i]===x.c?'good':'bad'):''}" id="f${i}">${checked?(selected[i]===x.c?'✓ Correct!':'Correct answer: '+ 'ABC'[x.c]+'. '+x.a[x.c]):''}</div></section>`).join('');updateProgress()}
function choose(i,j){selected[i]=j;checked=false;document.getElementById('result').textContent='';render()}
function updateProgress(){const n=Object.keys(selected).length;document.getElementById('count').textContent=`${n} of 8 answered`;document.getElementById('bar').style.width=(n/8*100)+'%'}
function checkAnswers(){checked=true;render();const score=data.filter((x,i)=>selected[i]===x.c).length;document.getElementById('result').textContent=`Your score: ${score} / 8 ${score===8?'🏆 Amazing!':score>=6?'⭐ Great work!':'💪 Keep practicing!'}`;document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function resetQuiz(){selected={};checked=false;document.getElementById('result').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
