</style></head><body><main><div class="brand">FLUENT MIND ADVENTURES</div><section class="panel" id="app"></section><div class="footer">Unofficial Warcraft fan project · For entertainment and roleplay inspiration · Not affiliated with Blizzard Entertainment · Skyborne not included in this version; verify race/class combinations before public release.</div></main><script type="application/json" id="data">{"questions": [{"t": "A Place to Call Home", "s": "After years on the road, you are offered a place to settle. No rent, no monsters in the cellar, and the neighbours seem reasonably civilised. Where would you feel most at home?", "o": ["A quiet village surrounded by forests, with winding paths and plenty of wildlife.", "A bustling city full of markets, libraries, theatres, and interesting strangers.", "A remote settlement in a harsh landscape, where people rely on one another.", "An old town with narrow streets, centuries of history, and a few suspiciously locked doors."]}, {"t": "A Well-Deserved Day Off", "s": "You've spent weeks saving villages, recovering stolen supplies, and doing other people's jobs. Finally, you have an entire day to yourself.", "o": ["Disappear into the wilderness. No plans, no maps, no responsibilities.", "Spend the day at a spa. I have suffered enough.", "Find a comfortable chair, a good book, and absolutely no people.", "Try something new. Preferably something that won't explode this time."]}, {"t": "The Missing Pages", "s": "In an abandoned library, you discover an old manuscript. Several pages have been carefully removed, and the remaining text refers to a discovery nobody seems to remember.", "o": ["Study the surviving text and try to reconstruct the missing information.", "Find out who removed the pages and what they were trying to hide.", "Search for someone who might recognise the manuscript or its author.", "Take the manuscript somewhere safe before deciding what to do next."]}, {"t": "A Rather Unexpected Crush", "s": "You've met someone rather charming during your travels. They seem interested in you too. Unfortunately, you're much better at fighting monsters than dealing with feelings. What happens next?", "o": ["Tell them exactly how I feel. Life is too short for guessing games.", "Invite them to a quiet place under the stars, bring their favourite food, and listen to their stories.", "Flirt shamelessly. A little charm never hurt anyone.", "Pretend nothing is happening while secretly composing increasingly dramatic love letters."]}, {"t": "The Road Less Travelled", "s": "You reach a crossroads. One road is safe and well maintained. The other is barely visible, disappearing into the hills. Nobody seems to know where it leads.", "o": ["Take the unknown road. That's what travelling is for.", "Ask around first. Someone must know something about those hills.", "Follow the safe road for now, but mark the other route on my map.", "Study the landscape and look for signs of who might have used the forgotten path."]}, {"t": "A Stranger at the Gate", "s": "A traveller arrives at your camp just before midnight. They are exhausted, frightened, and carrying a sealed letter. Moments later, armed riders appear and demand that you hand the stranger over.", "o": ["Give the traveller shelter while you find out what happened. Nobody deserves to be judged without being heard.", "Ask the riders for proof of their authority. A uniform is not an argument.", "Quietly arrange an escape route. The less anyone knows, the better.", "Tell both sides to put their weapons down. Whatever this is, it ends without bloodshed tonight."]}, {"t": "The Stolen Supplies", "s": "Someone has stolen your supplies. Again. This is the third time this week, and you're beginning to suspect that adventuring is mostly an expensive form of inconvenience.", "o": ["Find the thief, kick down their door, and demand my belongings back.", "Set a clever trap. Let's see how they enjoy being surprised.", "Investigate why someone is so desperate for supplies.", "Buy replacements, complain extensively, and reconsider my career choices."]}, {"t": "The Festival of Strangers", "s": "You arrive in a settlement during an unfamiliar festival. The streets are decorated, strange music fills the air, and everyone seems to know a tradition you've never heard of.", "o": ["Join in and learn the customs by taking part.", "Find someone willing to explain the history and meaning of the celebration.", "Ask an elder about the songs, family stories, and traditions behind the celebration.", "Explore the streets and discover what the festival reveals about everyday life here."]}, {"t": "The Shrine on the Hill", "s": "Every year, the villagers climb a hill to leave offerings at an ancient shrine. This year, the spring beside it has run dry. The elders say the place has been offended; a visiting engineer blames an underground collapse.", "o": ["Join the ceremony. Even if the cause is natural, the ritual matters to the people.", "Help the engineer inspect the spring. We need to know what physically changed.", "Bring the elders and the engineer together. They might both understand part of the problem.", "Organise water deliveries first. The debate can wait until nobody is thirsty."]}, {"t": "The Perfect Companion", "s": "A long expedition lies ahead. You can choose one travelling companion, and each has something different to offer.", "o": ["A quiet tracker who notices things everyone else misses.", "A brilliant scholar whose theories are controversial, to put it mildly.", "A cheerful storyteller who knows the customs and legends of many peoples.", "A resourceful survivor who can get us out of almost any disaster."]}, {"t": "A Dangerous Shortcut", "s": "A storm is gathering as your expedition reaches a dangerous mountain pass. Crossing now would save precious time, but the path is narrow and several companions are exhausted.", "o": ["Take charge and lead a careful crossing before the weather gets worse.", "Turn back. Supplies can be replaced; people cannot.", "Scout ahead alone and report what the route really looks like.", "Divide the group into teams, secure shelter, and reassess once everyone is safe."]}, {"t": "The Ideal Evening", "s": "It's getting dark. You have no urgent quests, no appointments, and nobody waiting for you. For once, the evening belongs entirely to you.", "o": ["Share a quiet evening by the fire, watching the stars and listening to the land around me.", "Find a lively inn, a warm meal, and someone with a good story.", "Stay up late organising my notes, discoveries, and collected treasures.", "Explore just a little further. There's something interesting beyond that hill."]}, {"t": "Trouble at the Inn", "s": "You're enjoying a peaceful dinner when two travellers begin arguing. Within minutes, chairs are flying, the innkeeper is shouting, and someone has knocked over your drink. Unforgivable.", "o": ["Grab the nearest troublemaker by the collar and throw them outside. Problem solved.", "Stay out of the way until I understand what started the argument.", "Use a little cleverness to turn their attention elsewhere and defuse the situation.", "Find the person responsible for my drink. We have unfinished business."]}, {"t": "The Unwanted Promotion", "s": "Your travelling companions have decided that you should lead the next expedition. Apparently, being reasonably competent is now a punishable offence.", "o": ["Accept. Someone needs to make decisions, and I can handle responsibility.", "Suggest that we make important decisions together.", "Decline. I'm much more effective when I can work independently.", "Agree, but delegate tasks according to everyone's strengths."]}, {"t": "A Test of Courage", "s": "A narrow bridge stretches across a deep ravine. It's old, unstable, and definitely not mentioned in the travel brochure. Crossing it would save several hours.", "o": ["Take a running start and cross before I can talk myself out of it.", "Find another route. Arriving alive is generally preferable.", "Test the bridge and work out whether it can support our weight.", "Help everyone else cross first, then follow once they're safe."]}, {"t": "The Oath", "s": "You made a promise to an old friend. Keeping it today would prevent you from helping strangers who urgently need you.", "o": ["Keep the promise. My word has to mean something, especially when it costs me.", "Help the strangers first, then face my friend and accept the consequences.", "Find someone else who can honour the promise while I help the strangers.", "Explain the situation to my friend and ask whether the promise can change."]}, {"t": "The Curious Little Creature", "s": "A strange animal has been following you for two days. It appears harmless, although it has already eaten one glove and attempted to steal your lunch.", "o": ["Adopt it. Clearly, we've chosen each other.", "Observe it carefully and learn more about its behaviour.", "Pick it up, put it in my bag, and keep walking. We're friends now.", "Teach it a few useful tricks. If it's staying, it might as well contribute."]}, {"t": "Love, Actually", "s": "Someone close to you has had a terrible day. They insist they're fine. They are very obviously not fine. What do you do?", "o": ["Sit beside them quietly. They can talk when they are ready.", "Find out who upset them. I just want to talk. Probably.", "Prepare their favourite meal and take care of everything for the evening.", "Distract them with an unexpected adventure. Preferably one that does not involve dying."]}, {"t": "The Climate Question", "s": "You have the chance to spend an entire season in a distant land. Your accommodation is paid for, and nobody expects you to save the world while you're there. Which environment sounds most appealing?", "o": ["Cool ancient forests, misty mornings, and a peaceful home among towering trees.", "Open grasslands, enormous skies, and a close-knit community gathered around the fire.", "Snow-covered mountains, crisp air, and a warm home to return to.", "A warm coastal region with colourful markets, lively streets, and excellent food."]}, {"t": "An Offer You Could Refuse", "s": "A powerful organisation offers you a prestigious position. You'll receive excellent resources, influential contacts, and a very impressive title. There are, naturally, a few conditions.", "o": ["Accept if their goals genuinely align with my principles.", "Negotiate. Influence is useful, but independence matters.", "Decline. I'd rather build something of my own.", "Investigate the organisation before making any promises."]}, {"t": "The Unexpected Challenge", "s": "At a festival, you can enter one competition. The prize is a wonderfully impractical golden trophy.", "o": ["A head-to-head combat trial. No riddles, no speeches. Just get in there and fight.", "A team rescue challenge. Winning means getting everyone across safely.", "A contest of improvisation: unfamiliar tools, impossible rules, and no preparation.", "A storytelling duel. Convince the audience that your absurd tale is true."]}, {"t": "The Broken Promise", "s": "A close companion breaks an important promise. They insist they had good reasons, but their decision has caused real trouble.", "o": ["Hear them out before deciding what to do.", "Make it clear that trust must be earned back through actions.", "Help repair the damage first. We can discuss blame afterwards.", "Step away for a while. I need time to decide whether I can trust them again."]}, {"t": "The World Changes", "s": "You return to a place you once loved and discover that it has changed almost beyond recognition. The people are different, old traditions are disappearing, and familiar landmarks are gone.", "o": ["Help preserve the old stories, sacred places, and traditions before they disappear.", "Learn about the changes before deciding whether they're good or bad.", "Help the community adapt and build something worthwhile from what remains.", "Move on. Places change, and perhaps it's time for a new chapter."]}, { try{const saved=JSON.parse(localStorage.getItem('fma-azeroth-v22'));if(saved&&saved.answers?.length===24){step=saved.step;mode=saved.mode;excluded=new Set(saved.excluded);answers=saved.answers}}catch(e){}
const btn=(s,a,alt=false,off=false)=>`<button class="btn ${alt?'alt':''}" data-action="${a}" ${off?'disabled':''}>${s}</button>`;function soft(a){let m=Math.max(...a),x=a.map(v=>Math.exp(v-m)),z=x.reduce((p,v)=>p+v,0);return x.map(v=>v/z)}function seed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rand(s){return ()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}function choose(p,r){let v=r(),s=0;for(let i=0;i<p.length;i++){s+=p[i];if(v<s)return i}return p.length-1}
function compute(){let cc=D.classes.map((c,j)=>answers.reduce((s,a,i)=>s+D.cw[i][a][j],0)),rr=D.races.map((c,j)=>answers.reduce((s,a,i)=>s+D.rw[i][a][j],0));let cp=cc.map((v,j)=>mode==='decide'&&excluded.has(D.classes[j])?-1e6:(v-D.cm[j])/D.cs[j]/1.2+D.cb[j]);let rng=rand(seed(answers.join('')+'|'+mode+'|'+[...excluded].sort().join(','))),cls=D.classes[choose(soft(cp),rng)];let rp=rr.map((v,j)=>D.compat[D.races[j]].includes(cls)?(v-D.rm[j])/D.rs[j]/1.2+D.rb[j]:-1e6),race=D.races[choose(soft(rp),rng)];return {cls,race,faction:D.races.indexOf(race)<4?'Alliance':'Horde'}}
function render(){try{try{localStorage.setItem('fma-azeroth-v22',JSON.stringify({step,mode,excluded:[...excluded],answers}))}catch(e){};if(step<0){app.innerHTML=`<div class="hero"><p class="small">AN INTERACTIVE CHARACTER DISCOVERY QUEST</p><h1>Who Are You in Azeroth?</h1><p>Every hero has a story. Yours begins with a few questionable decisions.</p><p>24 questions. One class, one race, one faction.</p></div><div class="inner"><h2>Choose your adventure</h2><div class="options"><button class="opt ${mode==='surprise'?'selected':''}" data-mode="surprise"><b>Surprise Me</b> — Let the adventure choose from all nine classes.</button><button class="opt ${mode==='decide'?'selected':''}" data-mode="decide"><b>Help Me Decide</b> — Exclude classes you definitely don't want.</button></div>${mode==='decide'?`<p class="small">Optional: select classes to exclude.</p><div class="choices">${D.classes.map(c=>`<label><input type="checkbox" data-exclude="${c}" ${excluded.has(c)?'checked':''}> ${c}</label>`).join('')}</div>`:''}<p class="small">8–12 minutes · RP-friendly · English</p>${btn('Begin your journey →','start',false,mode==='decide'&&excluded.size===9)}</div>`;return}if(step<24){let q=D.questions[step];app.innerHTML=`<div class="inner"><p class="small">QUESTION ${step+1} OF 24</p><div class="progress"><div style="width:${step/24*100}%"></div></div><div class="question-art"></div><h2>${q.t}</h2><p>${q.s}</p><div class="options">${q.o.map((s,j)=>`<button class="opt ${answers[step]===j?'selected':''}" data-choice="${j}"><b>${'ABCD'[j]}.</b> ${s}</button>`).join('')}</div><div class="actions">${btn('← Back','back',true)}${btn(step===23?'Reveal my character →':'Continue →','next',false,answers[step]===null)}</div></div>`;return}result=compute();app.innerHTML=`<div class="result-art"></div><div class="inner"><p class="small">YOUR CHARACTER REVEALED</p><h1>${result.race} ${result.cls}</h1><div class="result"><b>${result.faction}</b><p>${desc[result.cls]}</p><p class="small">Your choices led you here. This is one possible roleplay path — not a verdict about your personality.</p><div><span class="tag">${result.cls}</span><span class="tag">${result.race}</span><span class="tag">${result.faction}</span></div><p>Your journey begins here. Take your time.</p></div><p class="small">One possible roleplay path, not a verdict about your personality. A little fate is part of the fun.</p><div class="actions">${btn('Save result card','card')}${btn('Share result','share',true)}${btn('Copy result','copy',true)}${btn('Try again','reset',true)}</div><p id="feedback" class="small"></p></div>`}catch(e){app.textContent='Something went wrong: '+e.message;console.error(e)}}
app.addEventListener('change',e=>{let el=e.target.closest('[data-exclude]');if(el){el.checked?excluded.add(el.dataset.exclude):excluded.delete(el.dataset.exclude);render()}});app.addEventListener('click',async e=>{let m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;render();return}let o=e.target.closest('[data-choice]');if(o){answers[step]=+o.dataset.choice;render();return}let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case 'start':if(mode==='decide'&&excluded.size===9)return;step=0;break;case 'back':step=Math.max(-1,step-1);break;case 'next':if(answers[step]===null)return;step++;break;case 'reset':step=-1;answers.fill(null);break;case 'card':{let c=document.createElement('canvas');c.width=1200;c.height=630;let x=c.getContext('2d');x.fillStyle='#122630';x.fillRect(0,0,1200,630);x.strokeStyle='#e6bd79';x.lineWidth=7;x.strokeRect(25,25,1150,580);x.fillStyle='#eac585';x.font='bold 28px Georgia';x.fillText('FLUENT MIND ADVENTURES',70,100);x.font='60px Georgia';x.fillText(result.race+' '+result.cls,70,240);x.font='30px Georgia';x.fillText(result.faction,70,315);x.fillStyle='#f0e4cf';x.font='28px Georgia';x.fillText(desc[result.cls],70,395);x.fillStyle='#eac585';x.font='italic 26px Georgia';x.fillText('Your journey begins here.',70,530);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='fluent-mind-azeroth-result.png';a.click();return}case 'share':{let s=`Who Are You in Azeroth? I got ${result.race} ${result.cls} (${result.faction})! · Fluent Mind Adventures`;if(navigator.share){try{await navigator.share({title:'Who Are You in Azeroth?',text:s});}catch(e){}}else{try{await navigator.clipboard.writeText(s);document.getElementById('feedback').textContent='Result copied — share it with your friends!'}catch(e){window.prompt('Copy:',s)}}return}case 'copy':{let s=`Who Are You in Azeroth? — ${result.race} ${result.cls} (${result.faction}) | Fluent Mind Adventures`;try{await navigator.clipboard.writeText(s);b.textContent='Copied!'}catch{window.prompt('Copy result:',s)}return}}render();window.scrollTo(0,0)});render();
