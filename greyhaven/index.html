<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c22"><title>GREYHAVEN · Build Your Squad</title><link rel="stylesheet" href="styles.css?v=lesson-fix-7"></head><body>
<header><a class="brand" href="#" aria-label="Greyhaven headquarters"><span class="emblem">G</span><span>GREYHAVEN<small>FIELD OPERATIONS / CHAPTER 01</small></span></a><div class="top-actions"><div id="audioControls" hidden><label class="speed">Audio <select id="speed" aria-label="Audio speed"><option value="1">Normal</option><option value="0.8">Slow</option></select></label><span id="audioStatus" role="status" aria-live="polite"></span></div><span id="activePlayer" class="active-player"></span><div class="players-control"><button id="players" aria-expanded="false" aria-controls="playersMenu">Players</button><div id="playersMenu" class="players-menu" hidden><div id="profileList"></div><button id="menuNewPlayer">New player</button></div></div></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="playersScreen" class="players-screen" aria-label="Choose your hero"><section class="new-player"><h1>Choose your hero</h1><div id="setupPortraits" class="cards three"></div><div class="setup-fields"><div><label for="playerName">Name</label><input id="playerName" maxlength="80" autocomplete="off"></div><div><label for="playerCall">Call sign</label><input id="playerCall" maxlength="80" autocomplete="off"></div></div><p id="setupFeedback" class="feedback" role="alert"></p><button id="newPlayer" class="primary">Continue</button></section></section><div hidden id="mobileObjective" aria-label="Current objective"></div><main id="game" hidden><section class="world" aria-label="Headquarters"><div class="location"><span id="currentArea">GREYHAVEN</span><span>LEVEL 1 · <b id="xp">0</b> XP</span></div><h1>Build your squad.</h1><p class="subtitle">One team. Your choices. A city waiting.</p><div class="room" id="room"><img src="assets/hq.webp" alt="First-person view of Greyhaven headquarters: a registration terminal, weapons locker, radio desk, training area and exit gate."><div class="hotspots"><button class="hotspot terminal" data-zone="terminal"><i>01</i><span>Terminal</span></button><button class="hotspot locker" data-zone="locker"><i>02</i><span>Weapons</span></button><button class="hotspot desk" data-zone="desk"><i>03</i><span>Radio desk</span></button><button class="hotspot training" data-zone="training"><i>04</i><span>Training</span></button><button class="hotspot gate" data-zone="gate" disabled><i>05</i><span>Gate</span></button></div><div id="worldState" class="world-state"></div></div><div class="objective"><span class="eyebrow">CURRENT OBJECTIVE</span><div id="objective"></div></div><section class="squad-strip"><div class="strip-title"><span class="eyebrow">YOUR SQUAD</span><span id="squadCount">1 / 4</span></div><div id="squad"></div></section><details class="pack"><summary>Equipment &amp; backpack <span id="packCount"></span></summary><div id="inventory"></div></details><footer>FLUENT MIND ADVENTURES <span>Progress saves automatically</span></footer></section>
<section class="console" aria-label="Current mission"><nav id="stages" aria-label="Mission stages"></nav><div id="stage" tabindex="-1"></div><div class="stage-nav"><button id="back">Back</button><button class="primary" id="next">Continue</button></div></section></main>
<dialog id="heroDialog"><button id="heroClose" class="dialog-close" aria-label="Close character choice">×</button><h2>Character</h2><div id="heroChoices" class="cards three"></div></dialog><dialog id="wordDialog"><button class="dialog-close" aria-label="Close word help">×</button><span class="eyebrow">WORD SUPPORT · AMERICAN ENGLISH</span><h2 id="wordTitle"></h2><p class="ipa" id="ipa"></p><p id="translation" lang="ru"></p><button id="wordPlay" class="primary">▶ Listen</button><small id="wordSource"></small></dialog>
<script src="data.js?v=lesson-fix-7"></script><script src="dictionary.js?v=lesson-fix-7"></script><script src="audio-manifest.js?v=lesson-fix-7"></script><script src="core.js?v=lesson-fix-7"></script><script src="audio.js?v=lesson-fix-7"></script><script src="profiles.js?v=lesson-fix-7"></script><script src="app.js?v=lesson-fix-7"></script></body></html>
