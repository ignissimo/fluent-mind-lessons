<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karni English Lesson</title><meta name="description" content="English practice for Karni preparation: 64 questions, seven sections, rules and explanations. Not an official test."><style>body{font-family:Arial,sans-serif;background:#f2f5fb;color:#17243c;margin:0}main{max-width:850px;margin:auto;padding:22px}header,.card{background:white;padding:25px;border-radius:18px;margin-bottom:15px}header{background:#203b72;color:white}button{padding:13px 18px;margin:5px;border:2px solid #9db4da;border-radius:12px;background:white;font-size:18px;cursor:pointer}button:hover{background:#e5efff}.good{background:#d8f4e3}.bad{background:#ffe3df}.rule{background:#eaf1ff;padding:15px;margin:10px 0;border-radius:10px;font-size:20px}h1{font-size:30px}h2{font-size:26px}.question{font-size:25px;font-weight:bold}p{font-size:19px;line-height:1.5}#nav button{font-size:15px}#feedback{font-size:20px;min-height:35px}button:focus-visible{outline:3px solid #203b72;outline-offset:3px}button:disabled{cursor:default;color:#17243c}button.good{background:#d8f4e3}.rule.good{background:#d8f4e3}#nav button[aria-current]{background:#dbe8ff}#status,#audio-status{font-size:16px}#progress{font-size:18px}label{font-size:18px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}main{box-sizing:border-box}button{max-width:100%;overflow-wrap:anywhere}h2:focus{outline:none}@media(max-width:600px){main{padding:12px}header,.card{padding:16px}h1{font-size:26px}.question{font-size:22px}#nav button{padding:10px;margin:3px}}</style></head><body><main><header><h1>🧩 Karni English Academy</h1><p>Lesson 2 · Learn, practise, explain, try again · No timer</p><p>English practice for Karni preparation · Not an official test</p></header><p id="progress" aria-live="polite"></p><p id="status" role="status"></p><p id="audio-status" role="status"></p><nav class="card" id="nav" aria-label="Lesson sections"></nav><section class="card" id="content" aria-label="Practice"></section></main><script>
const units=[
{name:'IN · ON · AT',rules:['IN = inside a place, or a month/year: in a room, in July, in 2026.','ON = touching a surface, or a day: on the table, on Tuesday.','AT = a point or exact time: at the door, at 7:30.'],talk:'Explain why we say ON Monday but IN June. Give two more examples.',q:[['We meet ___ 8:30.','in|on|at',2,'AT is used for exact times.'],['My birthday is ___ July.','at|in|on',1,'IN is used for months.'],['The test is ___ Monday.','in|at|on',2,'ON is used for days.'],['She lives ___ Haifa.','on|in|at',1,'IN is used for cities.'],['The picture is ___ the wall.','at|on|in',1,'ON means attached to a surface.'],['We study ___ the evening.','in|on|at',0,'IN the evening is the fixed time expression.'],['He was born ___ 2014.','at|on|in',2,'IN is used for years.'],['They waited ___ the entrance.','at|on|in',0,'AT marks a specific point.'],['The books are ___ the shelf.','at|on|into',1,'ON a shelf describes position.'],['She is ___ school now.','on|at|into',1,'AT school describes a location or activity.']]},
{name:'Movement',rules:['IN = position; INTO = movement from outside to inside.','ACROSS = from one side to another; THROUGH = inside a passage.','OVER = above; UNDER = below; DOWN = towards a lower level.'],talk:'Describe how to move through a school using INTO, THROUGH, and ACROSS.',q:[['The cat was outside the box. It jumped ___ the box and stayed inside.','at|into|between',1,'INTO describes entering.'],['We entered the tunnel and walked ___ it to the other end.','across|through|over',1,'THROUGH describes movement inside a passage.'],['They swam ___ the river to the other bank.','across|into|between',0,'ACROSS means side to side.'],['The bird flew ___ the roof, high above it.','under|over|between',1,'OVER means above.'],['The ball rolled ___ the stairs.','down|at|between',0,'DOWN means toward a lower level.'],['The dog ran ___ the gate.','through|on|above',0,'THROUGH the opening of a gate.'],['She walked ___ the classroom.','into|on|over',0,'INTO means entering.'],['The bridge goes ___ the river.','across|through|into',0,'ACROSS spans from one bank to the other.']]},
{name:'Fixed expressions',rules:['Learn these as complete phrases: interested IN; good AT; afraid OF; depend ON.','listen TO; wait FOR; belong TO; proud OF.','borrow FROM someone; apologize FOR something.','arrive AT a station; arrive IN a city; prefer tea TO coffee.'],talk:'Make three sentences using expressions you often confuse.',q:[['She is interested ___ science.','on|in|at',1,'Interested IN is a fixed phrase.'],['He is good ___ maths.','at|in|for',0,'Good AT is a fixed phrase.'],['It depends ___ the weather.','in|of|on',2,'Depend ON is a fixed phrase.'],['Listen ___ your teacher.','at|to|for',1,'Listen TO someone.'],['I am waiting ___ my friend.','for|to|at',0,'Wait FOR someone.'],['She is afraid ___ spiders.','from|of|at',1,'Afraid OF is the standard phrase.'],['This bag belongs ___ me.','for|to|with',1,'Belong TO means ownership.'],['Her parents are proud ___ her.','for|of|on',1,'Proud OF is the fixed phrase.'],['He apologized ___ being late.','for|to|of',0,'Apologize FOR an action.'],['She borrowed a book ___ the library.','to|from|for',1,'Borrow FROM a source.'],['We arrived ___ the station.','to|at|on',1,'Arrive AT a specific place.'],['I prefer tea ___ coffee.','than|to|from',1,'Prefer A TO B.']]},
{name:'Past Simple',rules:['Positive: Yesterday she WENT home.','Questions: DID + subject + BASE VERB: Where did she GO?','Negative: DID NOT + BASE VERB: She did not GO.','With BE: Was she tired? Were they late?','When WHO asks about the person doing the action: Who broke the window? No DID is needed.'],talk:'Ask your teacher three questions about yesterday. Use WHERE, WHAT, WHY.',q:[['Where ___ you go yesterday?','did|were|do',0,'DID + base verb.'],['She did not ___ the answer.','knew|know|knows',1,'After DID NOT, use the base verb.'],['___ you at home last night?','Did|Were|Do',1,'Use WERE with YOU and BE.'],['Who ___ the window?','broke|did broke|breaked',0,'WHO is the subject, so use BROKE.'],['Yesterday they ___ to the museum.','go|went|gone',1,'Past of GO is WENT.'],['Why did he ___ early?','left|leave|leaves',1,'DID + LEAVE.'],['She ___ tired yesterday.','was|did|were',0,'SHE WAS.'],['What time ___ the film start?','did|was|were',0,'Use DID with action verb START.']]},
{name:'Comparatives',rules:['Short adjectives: tall → taller → the tallest.','Long adjectives: interesting → more interesting → the most interesting.','Irregular: good → better → the best; bad → worse → the worst.'],talk:'Compare two animals using three different adjectives.',q:[['This puzzle is ___ than the last one.','more difficult|difficulter|most difficult',0,'MORE + long adjective + THAN.'],['She is the ___ runner.','faster|fastest|most fast',1,'THE + superlative.'],['This answer is ___ than mine.','gooder|better|best',1,'GOOD → BETTER.'],['It is the ___ mistake.','worse|worst|baddest',1,'BAD → WORSE → WORST.'],['The blue box is heavier than the red one. Which is lighter?','Blue|Red|Same',1,'The red one is lighter.'],['My brother is ___ than me.','youngest|more young|younger',2,'YOUNGER THAN.']]},
{name:'Words & expressions',rules:['A definition explains meaning in English, without translation.','Use context clues and choose the closest meaning.','After each correct answer, make a spoken example.'],talk:'Explain three new words in English without translating.',q:[['Reliable means…','easy to trust|very tired|hard to see',0,'A reliable person does what they promise.'],['Hesitate means…','run quickly|pause because unsure|speak loudly',1,'Hesitate = pause before acting.'],['Exhausted means…','extremely tired|very angry|surprised',0,'Exhausted is stronger than tired.'],['Predict means…','say what may happen|remember the past|change the weather',0,'A prediction concerns the future.'],['Run out of means…','have none left|run outside|lose a race',0,'We ran out of milk = none is left.'],['Look after means…','take care of|search for|look behind',0,'Look after = care for.'],['Find out means…','discover information|lose an object|forget something',0,'Find out = learn a fact.'],['On purpose means…','by accident|intentionally|at the weekend',1,'On purpose = you meant to do it.'],['Ancient means…','very old|very noisy|very modern',0,'Ancient = from long ago.'],['A consequence is…','a result of an action|a question|a place',0,'A consequence is a result.'],['Curious means…','wanting to know more|very sleepy|angry',0,'Curious = interested in learning.'],['Avoid means…','stay away from|invite|improve',0,'Avoid = keep away from.']]},
{name:'Logic & knowledge',rules:['MUST BE TRUE means the answer follows from the facts.','ALL means every member. SOME means at least one.','Check opposites: before/after; increase/decrease; more/less.'],talk:'Invent two tricky true-or-false science statements.',q:[['All squares are rectangles. This is a square. It is…','a rectangle|a circle|not a rectangle',0,'Squares are a type of rectangle.'],['A dolphin is a mammal. Which is true?','It is a fish|It is a mammal|It is an insect',1,'Dolphins are mammals.'],['Anna is taller than Ben; Ben is taller than Leo. Who is shortest?','Anna|Ben|Leo',2,'Anna > Ben > Leo.'],['Which bird cannot fly?','Penguin|Eagle|Swallow',0,'Penguins cannot fly.'],['A light-year measures…','distance|time|temperature',0,'A light-year is a unit of distance.'],['Every red ticket is valid. Mia has a red ticket. It is…','valid|invalid|unknown',0,'The rule applies to every red ticket.'],['Which verb means the opposite of increase?','reduce|improve|include',0,'Reduce means make less.'],['Which does not belong?','generous|kind|helpful|selfish',3,'Selfish contrasts with the other words.']]}];
let unit=0,step=-1,attempts={},complete={},answered={},notebook={},positions={},storageOK=true;
const total=units.reduce((n,u)=>n+u.q.length,0);
function isRecord(v){return v!==null && typeof v==='object' && !Array.isArray(v)}
function validKey(k){const m=/^(\d+)-(\d+)$/.exec(k);return !!m && !!units[+m[1]] && +m[2]<units[+m[1]].q.length}
function flags(v){return isRecord(v)?Object.fromEntries(Object.entries(v).filter(([k,x])=>validKey(k)&&x===true)):{}}
try{
 complete=flags(JSON.parse(localStorage.getItem('karni_lesson2')||'{}'));
 const s=JSON.parse(localStorage.getItem('karni_lesson2_state')||'{}');
 if(isRecord(s)){
  answered=flags(s.answered);notebook=flags(s.notebook);
  if(isRecord(s.attempts))for(const [k,n]of Object.entries(s.attempts))if(validKey(k)&&Number.isSafeInteger(n)&&n>0)attempts[k]=n;
  if(isRecord(s.positions))for(const [i,n]of Object.entries(s.positions))if(units[i]&&Number.isInteger(n)&&n>=0&&n<=units[i].q.length)positions[i]=n;
  if(Number.isInteger(s.unit)&&units[s.unit])unit=s.unit;
  if(Number.isInteger(s.step)&&s.step>=-1&&s.step<=units[unit].q.length)step=s.step;
 }
 for(const k of Object.keys(answered))complete[k]=true;
}catch(e){storageOK=false}
function storageStatus(){document.getElementById('status').textContent=storageOK?'Progress saves automatically in this browser.':'Progress cannot be saved in this browser. Keep this page open while practising.'}
function save(){try{localStorage.setItem('karni_lesson2',JSON.stringify(complete));localStorage.setItem('karni_lesson2_state',JSON.stringify({unit,step,answered,attempts,notebook,positions}));storageOK=true}catch(e){storageOK=false}storageStatus()}
function stopSpeech(){if(window.speechSynthesis)window.speechSynthesis.cancel()}
function speak(t){const status=document.getElementById('audio-status');if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){status.textContent='Audio is not available. Please read the text aloud together.';return}try{stopSpeech();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;u.onerror=()=>{status.textContent='Audio is unavailable. Please read the text aloud together.'};status.textContent='';window.speechSynthesis.speak(u)}catch(e){status.textContent='Audio is unavailable. Please read the text aloud together.'}}
function go(i){if(!Number.isInteger(i)||!units[i])return;stopSpeech();unit=i;step=-1;draw()}
function reviewRule(){positions[unit]=step;step=-1;draw()}
function resumePractice(){step=positions[unit]??0;draw()}
function repeatSection(){for(let i=0;i<units[unit].q.length;i++){const k=unit+'-'+i;delete answered[k];delete attempts[k]}positions[unit]=0;step=0;draw()}
function nextQuestion(){if(!answered[unit+'-'+step])return;step++;positions[unit]=step;draw()}
function draw(){
 stopSpeech();
 save();
 document.getElementById('progress').textContent=Object.keys(complete).length+' / '+total+' questions solved';
 document.getElementById('nav').innerHTML=units.map((u,i)=>`<button onclick="go(${i})" ${i===unit?'aria-current="page"':''}>${i+1}. ${u.name}</button>`).join('');
 const u=units[unit],el=document.getElementById('content');
 if(step===-1){el.innerHTML=`<h2 tabindex="-1">${u.name} — Learn the rule</h2>${u.rules.map(r=>`<div class="rule">${r}</div>`).join('')}<p><b>Talk together:</b> ${u.talk}</p><button id="listen-rules">🔊 Listen to rules</button><p>Give an example before continuing.</p><button onclick="resumePractice()">${positions[unit]===undefined?'Start practice':'Continue practice'} →</button>`;document.getElementById('listen-rules').onclick=()=>speak(u.rules.join('. '))}
 else if(step>=u.q.length){const finished=Object.keys(complete).length===total;el.innerHTML=`<h2 tabindex="-1">${finished?'⭐ Lesson complete!':'⭐ Section complete!'}</h2><p>Explain one rule in your own words.</p><p>${u.talk}</p>${unit<units.length-1?'<button onclick="go(unit+1)">Next section →</button>':finished?'<p>You have solved all 64 questions. Choose any section to practise again.</p>':'<p>Choose another section above to finish the remaining questions.</p>'}<button onclick="repeatSection()">Repeat section</button>`}
 else{
 const q=u.q[step],key=unit+'-'+step,choices=q[1].split('|');
 el.innerHTML=`<p>${u.name} · Question ${step+1}/${u.q.length}</p><h2 class="question" tabindex="-1">${q[0]}</h2><button id="read-question">🔊 Read aloud</button><div id="choices"></div><div id="feedback" role="status" aria-live="polite"></div><div id="next"></div><p><button onclick="reviewRule()">📖 Review the rule</button></p>`;
 document.getElementById('read-question').onclick=()=>speak(q[0].replace(/___/g,' blank '));
 const offset=(q[2]-(unit+step)%choices.length+choices.length)%choices.length;
 document.getElementById('choices').innerHTML=choices.map((_,n)=>{const i=(n+offset)%choices.length;return `<button data-choice="${i}" onclick="choose(${i})">${String.fromCharCode(65+n)}. ${choices[i]}</button>`}).join('');
 if(answered[key])success(q,key);
 }
 el.querySelector('h2').focus();
}
function choose(i){
 const q=units[unit].q[step],key=unit+'-'+step;
 if(!q||answered[key]||!Number.isInteger(i)||i<0||i>=q[1].split('|').length)return;
 if(i===q[2]){answered[key]=true;complete[key]=true;save();success(q,key);document.getElementById('progress').textContent=Object.keys(complete).length+' / '+total+' questions solved'}
 else{attempts[key]=(attempts[key]||0)+1;save();document.getElementById('feedback').innerHTML='<div class="rule">Not yet. Read the whole question and compare the choices. You can review the rules and return here.<br><b>Try another answer.</b></div>';document.querySelector(`[data-choice="${i}"]`).classList.add('bad')}
}
function success(q,key){
 document.querySelectorAll('#choices button').forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===q[2])b.classList.add('good')});
 document.getElementById('feedback').innerHTML=`<div class="rule good">✓ Correct! ${q[3]} ${attempts[key]?'Good correction!':''}</div>`;
 document.getElementById('next').innerHTML=`<p>Say one new example aloud. Writing is optional.</p><label><input id="notebook" type="checkbox" ${notebook[key]?'checked':''}> I wrote an example in my notebook (optional)</label><p><button onclick="nextQuestion()">Next challenge →</button></p>`;
 document.getElementById('notebook').onchange=e=>{if(e.target.checked)notebook[key]=true;else delete notebook[key];save()};
}
draw();
</script></body></html>
