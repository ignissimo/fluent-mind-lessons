<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zuko Alone — Family Files</title><style>:root{--bg:#171b24;--panel:#252b36;--gold:#f4bf70;--ink:#f6f1e8;--muted:#bfc7d0;--accent:#b64e3e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4b2a2b,#171b24 65%);color:var(--ink);font:16px/1.55 system-ui,Arial}main{max-width:900px;margin:auto;padding:24px 16px 60px}header{border-bottom:2px solid var(--gold);padding:20px 0}h1{font-size:clamp(28px,5vw,46px);margin:4px 0;color:var(--gold)}h2{color:var(--gold);margin-top:0}h3{margin-bottom:8px}p{margin:8px 0 16px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid #55535a;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 10px 25px #0003}.tag{display:inline-block;border:1px solid var(--gold);border-radius:30px;padding:4px 12px;color:var(--gold);font-size:13px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.nav button{flex:1;min-width:90px}.btn,button{cursor:pointer;border:1px solid #987d69;border-radius:10px;background:#39414d;color:white;padding:11px 14px;font:inherit}button:hover{background:#4b5565}button.active,.primary{background:#a94838;border-color:#d88963}.primary:hover{background:#c35c46}button:disabled{opacity:.5;cursor:not-allowed}.question{padding:16px 0;border-top:1px solid #48505b}.options{display:grid;gap:8px;margin:12px 0}.options button{text-align:left}.options button.selected{border:2px solid var(--gold);background:#5d4b40}.feedback{font-size:14px;padding:8px 12px;border-left:3px solid var(--gold);background:#333a44;margin-top:8px}.good{border-color:#86c9a1}.bad{border-color:#e9a28c}textarea,input[type=text]{width:100%;background:#171e28;color:white;border:1px solid #697483;border-radius:9px;padding:12px;font:inherit}textarea{min-height:90px;resize:vertical}.rule{background:#172c31;border-left:4px solid #82b8b0;padding:14px;border-radius:8px;margin:15px 0}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}.hidden{display:none}.progress{height:9px;background:#444;border-radius:12px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#d66d4c,#f5c174);transition:width .3s}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#303844;padding:14px;border-radius:12px}small{color:var(--muted)}.timeline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.timeline span{background:#3d4550;padding:7px 10px;border-radius:7px}.printonly{display:none}@media print{body{background:white;color:black}main{max-width:none}.panel,.card{background:white;color:black;box-shadow:none;border-color:#999}.nav,.actions,.no-print{display:none}textarea{color:black;background:white}.printonly{display:block}}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}.still{margin:12px 0}.still img{display:block;width:100%;max-height:245px;object-fit:contain;background:#171b24;border-radius:12px}.still figcaption{color:var(--muted);font-size:13px;margin-top:5px}.cards{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}.actions>div{display:flex;gap:8px;flex-wrap:wrap}button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button[hidden]{display:none}@media(max-width:600px){.hero{grid-template-columns:1fr}.panel{padding:15px}}@media print{h1,h2,.muted,.still figcaption{color:black}.still img{max-height:160px}}
</style></head><body><main><header><div class="hero"><div><span class="tag">FLUENT MIND ADVENTURES · B1</span><h1>🔥 ZUKO ALONE</h1><p>THE FIRE NATION FAMILY FILES · Past tenses, choices and consequences</p><p class="muted">6 missions · approximately 35–40 minutes · based on the animated series (2005), Book 2 Episode 7</p></div><figure class="still"><img src="assets/hero.jpg" width="1000" height="749" alt="Zuko against a sunset sky"><figcaption>Avatar: The Last Airbender · © Nickelodeon</figcaption></figure></div><div class="progress"><div class="bar" id="bar"></div></div></header><nav class="nav" id="nav"></nav><section id="content"></section><div class="actions"><button id="prev">← Previous</button><div><button id="export">Download answers</button> <button id="print">Print</button></div><button class="primary" id="next">Next mission →</button></div><p class="muted" style="font-size:13px"><span id="saveStatus" role="status"></span> For open answers, discuss your reasoning with your teacher. · <a style="color:var(--gold)" href="assets/SOURCES.md">Image credits</a></p></main><script>
const sections=[
{title:'Two Children, One Family',time:'5 min',intro:'Zuko remembers his childhood. His sister Azula is confident and talented, while Zuko often feels that he is not good enough. Think about actions, not labels.',vocab:[['approval','when someone shows that they think you did well'],['expectations','what people think you should achieve'],['jealous','unhappy because someone has something you want'],['sensitive','easily affected by other people’s words or feelings'],['cruel','causing pain without caring about it'],['determined','continuing to try even when something is difficult']],questions:[['Whose firebending does Ozai show off to Fire Lord Azulon?',['Zuko','Azula','Iroh','Lee'],1,'Ozai asks Azula to demonstrate her firebending to Azulon.'],['Who shows Zuko care and support in his childhood?',['Ursa','Ozai','Azula','The village soldiers'],0,'Ursa supports Zuko.'],['What is a fair comparison?',['Azula never works hard.','Zuko is always weak.','The siblings respond differently to pressure.','Both children have identical experiences.'],2,'We can describe different actions without making absolute judgments.']],writing:[['Compare young Zuko and Azula. Write 3–4 sentences using while, but or whereas.','When they were children, ...'],['What is one action that shows how Zuko feels about his family?','One example is ...']]},
{title:'Childhood Memories',time:'7 min',intro:'Use Past Simple for completed events and Past Continuous for an action in progress.',rule:'PAST SIMPLE: subject + past verb (Zuko <b>practised</b>). PAST CONTINUOUS: was/were + verb-ing (Zuko <b>was practising</b>). In these examples, <b>when</b> introduces an interruption and <b>while</b> introduces an action in progress. The meaning, not the linking word alone, determines the tense. Practice example (not a quote): Zuko <b>was practising</b> when Azula <b>laughed</b>.',questions:[['Show an action already in progress: Zuko ___ when Azula interrupted him.',['trained','was training','had train','is training'],1,'An action was already in progress.'],['Show the background action: While Ursa ___ to Zuko, Azula entered.',['talked','was talking','had talk','talks'],1,'While introduces the background action.'],['Zuko ___ upset after he heard the news.',['felt','was feeling always','had feel','feels'],0,'A completed past reaction: felt.'],['When Zuko was younger, he ___ hard to improve.',['tries','was try','tried','had trying'],2,'A past habit can use Past Simple.'],['Azula ___ while the others were watching.',['was showing off','show off','had show','shows'],0,'An ongoing action at that moment.'],['The family ___ in the palace when the news arrived.',['were living','living','have lived','live'],0,'Background situation interrupted by an event.']],writing:[['Complete: “Zuko was ______ when ______.”','Zuko was ...'],['Write one sentence with while and one with when about the childhood flashbacks.','While ...'] ]},
{title:'What Happened First?',time:'6 min',intro:'Read the family history and decide which event happened earlier.',reading:'Young Zuko lives in the Fire Nation palace with his family. He wants his father to be proud of him, but Ozai often prefers Azula’s achievements. Ursa cares for Zuko and tries to protect him. During the royal family’s conflict, Ursa disappears from the palace. Later, Zuko remembers her kindness. By the time he understands how much his life has changed, his mother has already left. These memories help explain why Zuko struggles with trust and approval.',rule:'PAST PERFECT: <b>had + past participle</b>. It shows an event before another moment in the past. <b>By the time Zuko looked for his mother, she had disappeared.</b> Earlier: she disappeared → Later: he looked. Do not use Past Perfect for every past event.',questions:[['Use the Past Perfect: By the time Zuko looked for Ursa, she ___.',['left','had left','was leave','has leave'],1,'Her departure happened before he looked.'],['Zuko remembered the kindness his mother ___ him.',['had shown','was show','shows','has showing'],0,'The kindness happened before he remembered it.'],['Use the Past Simple: When Zuko ___ the village, he met Lee.',['had reached','reached','was reaching always','has reached'],1,'Use Past Simple for the main event in the sequence.'],['Choose the correct order: “Zuko had met Lee before the soldiers arrived.”',['Soldiers arrived → Zuko met Lee','Zuko met Lee → Soldiers arrived','Both happened tomorrow','We cannot tell'],1,'Had met happened earlier.'],['Which sentence uses Past Perfect correctly?',['Azula had laugh yesterday.','Ursa had left before Zuko understood.','Zuko had went home.','He was had left.'],1,'Had + past participle, with a later past reference.']],writing:[['Write two sentences using had + past participle to explain earlier events.','By the time ...'],['Why might a childhood memory affect a person years later? Write 2 sentences.','A memory might ...']]},
{title:'The Village Incident',time:'7 min',intro:'Read the report. Separate what happened from what the characters believed.',reading:'Zuko travels alone through the Earth Kingdom and reaches a small village. A boy named Lee and his family offer him food and a place to stay. Zuko begins to trust them. When Lee is taken by corrupt Earth Kingdom soldiers, Zuko decides to help. He fights the soldiers and protects the boy. During the fight, he uses firebending and reveals that he is Prince Zuko of the Fire Nation. The villagers become frightened and angry. The episode shows their rejection. The war may help explain why they do not trust him, even though he has just helped them. Zuko leaves the village alone.',questions:[['Why does Lee’s family initially welcome Zuko?',['They know he is a prince.','They offer hospitality to a traveller.','They want to arrest him.','They work for Ozai.'],1,'They help a traveller without knowing his identity.'],['What changes the villagers’ opinion of Zuko?',['He asks for food.','He leaves early.','He reveals that he is from the Fire Nation.','He loses his horse.'],2,'His identity changes how they interpret him.'],['Which statement is a fact from the reading?',['Zuko intended to hurt Lee.','All Fire Nation people are cruel.','Zuko fought the soldiers to help Lee.','The villagers secretly liked Zuko.'],2,'The text describes Zuko helping Lee.'],['Why might the villagers fear Zuko?',['They may associate the Fire Nation with the war.','They dislike every traveller.','Lee tells them to fear him.','They have never heard of the war.'],0,'This is a plausible interpretation, not a fact about every villager.'],['What is the difference between intention and impact?',['They always mean the same thing.','Intention is the goal; impact is the result for others.','Impact is what happened first.','Intention means punishment.'],1,'A helpful intention can still have a complicated impact.']],writing:[['What did Zuko intend to do? How did the villagers interpret his actions? Write 3 sentences.','Zuko wanted to ... However, ...'],['Was it reasonable for the villagers to feel afraid? Give one reason based on the text.','They might have felt ... because ...']]},
{title:'Zuko vs Azula',time:'7 min',intro:'Use evidence from the episode to compare the siblings. Avoid “always” and “never” unless the story supports it.',rule:'Useful language: <b>while, whereas, however, because, although</b>. Past tense: “Azula <b>received</b> praise, while Zuko <b>was trying</b> to earn approval.” For uncertainty: “This <b>might suggest</b> ...”',questions:[['Which sentence is the most careful interpretation?',['Azula was born evil.','Zuko never makes mistakes.','Azula often seeks her father’s approval.','Every sibling behaves the same.'],2,'This describes a pattern rather than a fixed label.'],['What is a good way to support an opinion?',['Repeat it louder.','Give a scene or action from the episode.','Guess what the actor thinks.','Ignore other views.'],1,'Evidence makes an argument stronger.']],writing:[['CHILDHOOD: Compare what Zuko and Azula wanted and how they behaved. Write 3 sentences.','Zuko wanted ... whereas Azula ...'],['PARENTS: How did Ursa and Ozai respond differently to the children? Write 2–3 sentences.','Ursa ... but Ozai ...'],['PRESENT: Compare Zuko’s choices in the village with what we know about Azula’s behaviour. Write 3 sentences.','In the village, Zuko ...'],['Write a short conclusion: How did their family experiences influence them? Use 5–6 sentences and at least two past tenses.','I think their childhood ...']]},
{title:'Who Is Zuko Now?',time:'5 min',intro:'Final social reasoning mission. There may be more than one defensible opinion. Explain with evidence.',questions:[['Which is an observation rather than a judgment?',['Zuko is a terrible person.','Zuko used firebending to protect Lee.','The villagers are stupid.','Azula has no feelings.'],1,'An observation describes an action we can identify.'],['What is a respectful way to disagree?',['You are wrong, stop talking.','That is stupid.','I see your point, but I think ... because ...','Everybody agrees with me.'],2,'Respectful disagreement includes a reason.']],writing:[['Can someone help others and still be seen as an enemy? Explain using Zuko’s experience.','Yes / No / Sometimes, because ...'],['Do people have to repeat their parents’ mistakes? Why or why not?','I think ...'],['Choose: “What should Zuko do next?” or “Could Azula make different choices?” Write 3–4 sentences.','I believe ... because ...']]}
];
const store='fm-zuko-alone-v1';const $=id=>document.getElementById(id);const data={page:0,answers:{},writing:{},finished:false};
try{const x=JSON.parse(localStorage.getItem(store));if(x&&typeof x==='object'){
 if(Number.isInteger(x.page)&&sections[x.page])data.page=x.page;
 data.finished=x.finished===true&&data.page===sections.length-1;
 sections.forEach((s,p)=>{
  s.questions.forEach((q,i)=>{const k=p+'-'+i,v=x.answers?.[k];if(Number.isInteger(v)&&q[1][v]!==undefined)data.answers[k]=v});
  s.writing.forEach((_,i)=>{const k=p+'-'+i;if(typeof x.writing?.[k]==='string')data.writing[k]=x.writing[k]});
 });
}}catch{}
function save(){
 let status='Progress saved in this browser.';
 try{localStorage.setItem(store,JSON.stringify(data))}catch{status='This browser could not save progress. Download your answers before closing.'}
 if($('saveStatus').textContent!==status)$('saveStatus').textContent=status;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const content=document.getElementById('content');const nav=document.getElementById('nav');function render(){let s=sections[data.page];document.getElementById('bar').style.width=((data.page+1)/sections.length*100)+'%';nav.innerHTML=sections.map((x,i)=>`<button class="${i===data.page?'active':''}" aria-current="${i===data.page&&!data.finished?'step':'false'}" onclick="go(${i})">${i+1}. ${esc(x.title.split(' ').slice(0,2).join(' '))}</button>`).join('');$('next').hidden=data.finished;$('prev').textContent=data.finished?'← Review final mission':'← Previous';$('print').textContent='Print this screen';
if(data.finished){const total=sections.reduce((n,m)=>n+m.questions.length,0),correct=sections.reduce((n,m,p)=>n+m.questions.filter((q,i)=>data.answers[p+'-'+i]===q[2]).length,0);
 content.innerHTML=`<article class="panel"><h2 tabindex="-1">Lesson complete</h2><p>Quiz answers correct: ${correct} of ${total}. Discuss your written answers with your teacher.</p><p>Use Download answers to keep all six missions in one file, or select a mission to review it.</p></article>`;return}
let html=`<article class="panel"><span class="tag">MISSION ${data.page+1} / ${sections.length} · ${s.time}</span><h2 tabindex="-1">${esc(s.title)}</h2><p>${esc(s.intro)}</p>`;if(data.page===0)html+='<figure class="still"><img src="assets/family.jpg" width="1000" height="750" alt="Ursa holds young Zuko in the palace courtyard"><figcaption>Ursa and Zuko · childhood flashback</figcaption></figure>';if(s.rule)html+=`<div class="rule"><strong>GRAMMAR RULE</strong><p>${s.rule}</p></div>`;if(s.vocab)html+=`<h3>Vocabulary</h3><div class="cards">${s.vocab.map(v=>`<div class="card"><b>${esc(v[0])}</b><br><small>${esc(v[1])}</small></div>`).join('')}</div>`;if(s.reading)html+=`<h3>Reading</h3><div class="rule" style="background:#32383e;border-color:#e7b96c">${esc(s.reading)}</div>`;if(s.questions){html+='<h3>Check your understanding</h3>';s.questions.forEach((q,i)=>{let id=`${data.page}-${i}`,chosen=data.answers[id];html+=`<div class="question"><b>${i+1}. ${esc(q[0])}</b><div class="options">${q[1].map((o,j)=>`<button class="${chosen===j?'selected':''}" aria-pressed="${chosen===j}" onclick="choose('${id}',${j})">${esc(o)}</button>`).join('')}</div>${chosen===undefined?'':`<div role="status" class="feedback ${chosen===q[2]?'good':'bad'}">${chosen===q[2]?'✓ Correct!':'Not quite. Try again.'} ${chosen===q[2]?esc(q[3]):'Read the explanation or rule above, then choose again.'}</div>`}</div>`})}if(s.writing){html+='<h3>Write & discuss</h3><p class="muted">Write first. Then use your sentences to speak with your teacher.</p>';s.writing.forEach((q,i)=>{let id=`${data.page}-${i}`;html+=`<div class="question"><label for="w${i}"><b>${i+1}. ${esc(q[0])}</b></label><textarea id="w${i}" data-key="${id}" placeholder="${esc(q[1])}">${esc(data.writing[id]||'')}</textarea></div>`})}html+='</article>';content.innerHTML=html;content.querySelectorAll('textarea').forEach(el=>el.addEventListener('input',()=>{data.writing[el.dataset.key]=el.value;save()}));document.getElementById('prev').disabled=data.page===0;document.getElementById('next').textContent=data.page===sections.length-1?'Finish lesson ✓':'Next mission →';}function transition(){save();render();content.querySelector('h2').focus({preventScroll:true});window.scrollTo(0,0)}
window.go=i=>{if(!Number.isInteger(i)||!sections[i])return;data.page=i;data.finished=false;transition()};
window.choose=(id,j)=>{if(data.finished)return;const row=Number(id.split('-')[1]),q=sections[data.page].questions[row];if(id!==data.page+'-'+row||!q||!Number.isInteger(j)||q[1][j]===undefined)return;data.answers[id]=j;save();render();content.querySelectorAll('.question')[row]?.querySelectorAll('button')[j]?.focus({preventScroll:true})};
$('prev').onclick=()=>go(data.finished?data.page:data.page-1);
$('next').onclick=()=>{if(data.page===sections.length-1){data.finished=true;transition()}else go(data.page+1)};
document.getElementById('print').onclick=()=>window.print();document.getElementById('export').onclick=()=>{let out='ZUKO ALONE — THE FIRE NATION FAMILY FILES\n\n';sections.forEach((s,p)=>{out+=`MISSION ${p+1}: ${s.title}\n`;s.questions?.forEach((q,i)=>{let a=data.answers[`${p}-${i}`];out+=`${q[0]}\nAnswer: ${a===undefined?'(not answered)':q[1][a]}\n`});s.writing?.forEach((q,i)=>out+=`${q[0]}\n${data.writing[`${p}-${i}`]||'(not answered)'}\n`);out+='\n'});let blob=new Blob([out],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zuko_alone_lesson_answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();save();
</script></body></html>
